name: Run custody parties/categories implementation

on:
  push:
    branches: [repair/custody-final-settlement-20260901]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: repair/custody-final-settlement-20260901
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute the implementation script from the guarded workflow
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          import subprocess

          wf = Path('.github/workflows/implement-custody-parties-categories.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply custody parties/categories model\n'
          start = wf.index(marker)
          block = wf[start:]
          run_marker = '        run: |\n'
          run_start = block.index(run_marker) + len(run_marker)
          rest = block[run_start:]
          lines = []
          for line in rest.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  break
          script = '\n'.join(lines)
          exec(compile(script, 'implementation.py', 'exec'), {'__name__': '__main__'})

      - name: Verify repository changes
        run: |
          git diff --check
          grep -q 'partyType' app/src/main/java/com/myaccounts/app/data/custody/CustodyEntities.kt
          grep -q 'categoryName' app/src/main/java/com/myaccounts/app/data/custody/CustodyEntities.kt
          grep -q 'MIGRATION_15_16' app/src/main/java/com/myaccounts/app/data/local/AppDatabase.kt

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myaccounts/app/data/custody/CustodyEntities.kt \
            app/src/main/java/com/myaccounts/app/data/local/AppDatabase.kt \
            app/src/main/java/com/myaccounts/app/data/custody/CustodyRepository.kt \
            app/src/main/java/com/myaccounts/app/ui/viewmodel/CustodyViewModel.kt \
            app/src/main/java/com/myaccounts/app/ui/screens/CustodyLedgerScreen.kt \
            app/src/main/java/com/myaccounts/app/ui/screens/CustodyCompactScreenFinal.kt \
            app/src/main/java/com/myaccounts/app/ui/screens/CustodyEditDialogs.kt
          if git diff --cached --quiet; then
            echo 'No implementation changes were necessary.'
            exit 0
          fi
          git commit -m 'feat(custody): support parties and custody categories'
          git push origin HEAD:repair/custody-final-settlement-20260901
