name: Apply verified direct URI source fix

on:
  push:
    branches:
      - fix/report-sharing-archive-restore

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply exact source changes
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          base = root / 'app/src/main/java/com/myaccounts/app'
          util = base / 'util'
          screens = base / 'ui/screens/reports'

          exporters = [
              util / 'GeneralReportsPdfExporter.kt',
              util / 'GeneralReportsExcelExporter.kt',
              util / 'MultiCurrencyReportPdfExporter.kt',
              util / 'MultiCurrencyReportExcelExporter.kt',
              util / 'PersonReportPdfExporter.kt',
              util / 'PersonReportExcelExporter.kt',
          ]

          for path in exporters:
              text = path.read_text(encoding='utf-8')
              if text.count('Result<String>') == 0:
                  raise SystemExit(f'{path}: expected current Result<String> API; source changed unexpectedly')
              if text.count('Result<String>') != text.count('Result.success'):
                  raise SystemExit(f'{path}: Result<String>/Result.success structure is not the verified current shape')
              if 'import android.net.Uri' not in text:
                  anchor = 'import android.content.Context\n'
                  if text.count(anchor) != 1:
                      raise SystemExit(f'{path}: Context import anchor is not unique')
                  text = text.replace(anchor, anchor + 'import android.net.Uri\n', 1)
              text = text.replace('Result<String>', 'Result<Uri>')

              # Android 10+ branch: return the exact MediaStore URI created by this export.
              q = re.sub(r'Result\.success\("[^"]*"\)', 'Result.success(uri)', text, count=1)
              if q == text:
                  raise SystemExit(f'{path}: verified MediaStore success expression was not found')
              text = q

              # Pre-Android 10 branch: return a shareable FileProvider URI for the exact file written.
              if 'Result.success(file.absolutePath)' in text:
                  text = text.replace('Result.success(file.absolutePath)', 'Result.success(ReportShareUtil.fileToShareUri(context, file))', 1)
              elif 'File(dir, fileName).also { FileOutputStream(it).use { out -> document.writeTo(out) } }; Result.success(' in text:
                  old = 'File(dir, fileName).also { FileOutputStream(it).use { out -> document.writeTo(out) } }; Result.success('
                  new = 'val file = File(dir, fileName); FileOutputStream(file).use { out -> document.writeTo(out) }; Result.success(ReportShareUtil.fileToShareUri(context, file))'
                  text = text.replace(old, new, 1)
              elif 'File(dir, fileName).also { FileOutputStream(it).use { out -> writeWorkbook(out, sheet) } }' in text:
                  old = 'File(dir, fileName).also { FileOutputStream(it).use { out -> writeWorkbook(out, sheet) } }; Result.success('
                  new = 'val file = File(dir, fileName); FileOutputStream(file).use { out -> writeWorkbook(out, sheet) }; Result.success(ReportShareUtil.fileToShareUri(context, file))'
                  text = text.replace(old, new, 1)
              else:
                  raise SystemExit(f'{path}: verified legacy output branch was not found')

              if 'Result<String>' in text or 'Result.success("' in text or 'Result.success(file.absolutePath)' in text:
                  raise SystemExit(f'{path}: URI migration left unconverted success code')
              if text.count('Result.success(uri)') != 1:
                  raise SystemExit(f'{path}: expected exactly one MediaStore Result.success(uri) after migration')
              if text.count('ReportShareUtil.fileToShareUri(context, file)') != 1:
                  raise SystemExit(f'{path}: expected exactly one legacy FileProvider result after migration')

              # All exporters live in the same util package; use the helper without a package import.
              path.write_text(text, encoding='utf-8')

          share = util / 'ReportShareUtil.kt'
          text = share.read_text(encoding='utf-8')
          helper = '''    fun fileToShareUri(context: Context, file: File): Uri =
        FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file)

'''
          if 'fun fileToShareUri(' not in text:
              anchor = 'object ReportShareUtil {\n'
              if text.count(anchor) != 1:
                  raise SystemExit('ReportShareUtil object anchor is not unique')
              text = text.replace(anchor, anchor + helper, 1)
              share.write_text(text, encoding='utf-8')

          reports = screens / 'ReportsScreen.kt'
          text = reports.read_text(encoding='utf-8')
          if text.count('ReportShareUtil.findLatestReportAfter') != 1:
              raise SystemExit('ReportsScreen: expected exactly one legacy latest-file lookup')
          if text.count('val exportStartedAt = System.currentTimeMillis()') != 1:
              raise SystemExit('ReportsScreen: expected exactly one export timestamp')
          text = text.replace('            val exportStartedAt = System.currentTimeMillis()\n', '', 1)
          old = '''            result.fold(
                { _ ->
                    val mimeType = if (pdf) "application/pdf" else "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                    ReportShareUtil.findLatestReportAfter(context, reportPrefix(), mimeType, exportStartedAt).fold(
                        { resolvedUri -> if (pdf) lastPdfUri = resolvedUri else lastExcelUri = resolvedUri },
                        { exception -> snackbar.showSnackbar("تم إنشاء التقرير، لكن تعذر ربطه بالمشاركة: ${exception.message ?: "خطأ غير معروف"}") }
                    )
                    snackbar.showSnackbar("تم إنشاء التقرير بنجاح.")
                },
                { exception -> snackbar.showSnackbar("تعذر إنشاء التقرير: ${exception.message ?: "خطأ غير معروف"}") }
            )'''
          new = '''            result.fold(
                { uri ->
                    if (pdf) lastPdfUri = uri else lastExcelUri = uri
                    snackbar.showSnackbar("تم إنشاء التقرير بنجاح.")
                },
                { exception -> snackbar.showSnackbar("تعذر إنشاء التقرير: ${exception.message ?: "خطأ غير معروف"}") }
            )'''
          if old not in text:
              raise SystemExit('ReportsScreen: exact export result block does not match verified source')
          text = text.replace(old, new, 1)
          text = text.replace('''    fun reportPrefix(): String {
        val allCurrencies = state.selectedCurrencyCode == "ALL"
        return if (allCurrencies) when (reportType) {
            ReportType.PEOPLE -> "MyAccounts_تقرير الأشخاص"
            ReportType.DETAILED -> "MyAccounts_التقرير العام"
            ReportType.SUMMARY -> "MyAccounts_أرصدة الحسابات"
        } else when (reportType) {
            ReportType.PEOPLE -> "MyAccounts_تقرير_الأشخاص"
            ReportType.DETAILED -> "MyAccounts_التقرير_التفصيلي"
            ReportType.SUMMARY -> "MyAccounts_ملخص_الأشخاص"
        }
    }

''', '', 1)
          if 'ReportShareUtil.findLatestReportAfter' in text:
              raise SystemExit('ReportsScreen: latest-file discovery remains')
          reports.write_text(text, encoding='utf-8')

          person = screens / 'PersonReportScreen.kt'
          text = person.read_text(encoding='utf-8')
          if text.count('ReportShareUtil.findLatestReportAfter') != 1:
              raise SystemExit('PersonReportScreen: expected exactly one legacy latest-file lookup')
          if text.count('val exportStartedAt = System.currentTimeMillis()') != 1:
              raise SystemExit('PersonReportScreen: expected exactly one export timestamp')
          text = text.replace('            val exportStartedAt = System.currentTimeMillis()\n', '', 1)
          old = '''            result.onFailure { snackbar.showSnackbar("تعذر إنشاء التقرير.") }.onSuccess {
                val mimeType = if (pdf) "application/pdf" else "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                val prefix = "MyAccounts_تقرير حساب ${report.personName}"
                ReportShareUtil.findLatestReportAfter(context, prefix, mimeType, exportStartedAt).fold(
                    { uri -> if (pdf) { lastPdfUri = uri; lastPdfExportAt = exportStartedAt } else { lastExcelUri = uri; lastExcelExportAt = exportStartedAt } },
                    { exception -> snackbar.showSnackbar("تم تصدير التقرير، لكن تعذر ربطه بالمشاركة: ${exception.message ?: "خطأ غير معروف"}") }
                )
                snackbar.showSnackbar("تم تصدير التقرير بنجاح.")
            }'''
          new = '''            result.onFailure { snackbar.showSnackbar("تعذر إنشاء التقرير.") }.onSuccess { uri ->
                if (pdf) lastPdfUri = uri else lastExcelUri = uri
                snackbar.showSnackbar("تم تصدير التقرير بنجاح.")
            }'''
          if old not in text:
              raise SystemExit('PersonReportScreen: exact export result block does not match verified source')
          text = text.replace(old, new, 1)
          for line in [
              '    var lastPdfExportAt by remember { mutableStateOf<Long?>(null) }\n',
              '    var lastExcelExportAt by remember { mutableStateOf<Long?>(null) }\n',
              '        lastPdfExportAt = null\n',
              '        lastExcelExportAt = null\n',
          ]:
              text = text.replace(line, '', 1)
          if 'ReportShareUtil.findLatestReportAfter' in text:
              raise SystemExit('PersonReportScreen: latest-file discovery remains')
          person.write_text(text, encoding='utf-8')

          # Final source-level verification.
          for path in exporters:
              text = path.read_text(encoding='utf-8')
              assert 'Result<String>' not in text
              assert text.count('Result.success(uri)') == 1
              assert text.count('ReportShareUtil.fileToShareUri(context, file)') == 1
          assert 'ReportShareUtil.findLatestReportAfter' not in reports.read_text(encoding='utf-8')
          assert 'ReportShareUtil.findLatestReportAfter' not in person.read_text(encoding='utf-8')
          assert 'fun fileToShareUri(' in share.read_text(encoding='utf-8')
          print('SOURCE VERIFICATION: PASS')

      - name: Compile Kotlin
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Diff check
        run: git diff --check

      - name: Commit source fix and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-direct-uri-source-fix.yml
          git add app/src/main/java/com/myaccounts/app/util app/src/main/java/com/myaccounts/app/ui/screens/reports
          git commit -m 'fix(reports): return exact exported URI for sharing [direct-uri-verified]'
          git push origin HEAD:fix/report-sharing-archive-restore
