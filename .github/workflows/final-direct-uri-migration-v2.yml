name: Final direct report URI migration v2

on:
  push:
    branches:
      - fix/report-sharing-archive-restore
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[run-direct-uri-v2]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply verified source migration
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          exporters = [
              root / 'app/src/main/java/com/myaccounts/app/util/GeneralReportsPdfExporter.kt',
              root / 'app/src/main/java/com/myaccounts/app/util/GeneralReportsExcelExporter.kt',
              root / 'app/src/main/java/com/myaccounts/app/util/MultiCurrencyReportPdfExporter.kt',
              root / 'app/src/main/java/com/myaccounts/app/util/MultiCurrencyReportExcelExporter.kt',
              root / 'app/src/main/java/com/myaccounts/app/util/PersonReportPdfExporter.kt',
              root / 'app/src/main/java/com/myaccounts/app/util/PersonReportExcelExporter.kt',
          ]

          for path in exporters:
              text = path.read_text(encoding='utf-8')
              media_success = 'Result.success("'
              legacy_success = 'Result.success(file.absolutePath)'
              media_count = text.count(media_success)
              legacy_count = text.count(legacy_success)
              result_count = text.count('Result<String>')

              if result_count == 0:
                  raise SystemExit(f'{path}: no Result<String> remains to migrate; refusing blind edit')
              if media_count == 0 and legacy_count == 0:
                  raise SystemExit(f'{path}: no verified export success sites found')

              text = text.replace('Result<String>', 'Result<Uri>')
              text = text.replace(media_success, 'Result.success(uri)')
              text = text.replace(legacy_success, 'Result.success(ReportShareUtil.fileToShareUri(context, file))')

              if 'import android.net.Uri' not in text:
                  marker = 'import android.content.Context\n'
                  if marker not in text:
                      raise SystemExit(f'{path}: Context import anchor missing')
                  text = text.replace(marker, marker + 'import android.net.Uri\n', 1)

              if 'import com.myaccounts.app.util.ReportShareUtil' not in text:
                  marker = 'package com.myaccounts.app.util\n\n'
                  if marker not in text:
                      raise SystemExit(f'{path}: package anchor missing')
                  text = text.replace(marker, marker + 'import com.myaccounts.app.util.ReportShareUtil\n\n', 1)

              if 'Result<String>' in text or 'Result.success("' in text or 'Result.success(file.absolutePath)' in text:
                  raise SystemExit(f'{path}: migration residue remains')

              path.write_text(text, encoding='utf-8')
              print(path, 'migrated', 'Result<String>=', result_count, 'media-success=', media_count, 'legacy-success=', legacy_count)

          util = root / 'app/src/main/java/com/myaccounts/app/util/ReportShareUtil.kt'
          text = util.read_text(encoding='utf-8')
          if 'fun fileToShareUri(' not in text:
              anchor = 'object ReportShareUtil {\n'
              if anchor not in text:
                  raise SystemExit('ReportShareUtil object anchor missing')
              helper = '    fun fileToShareUri(context: Context, file: File): Uri =\n        FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file)\n\n'
              text = text.replace(anchor, anchor + helper, 1)
              util.write_text(text, encoding='utf-8')

          reports = root / 'app/src/main/java/com/myaccounts/app/ui/screens/reports/ReportsScreen.kt'
          text = reports.read_text(encoding='utf-8')
          marker = 'ReportShareUtil.findLatestReportAfter'
          if marker not in text:
              raise SystemExit('ReportsScreen does not contain the known legacy discovery call')
          text = text.replace('            val exportStartedAt = System.currentTimeMillis()\n', '', 1)
          old = '''            result.fold(\n                { _ ->\n                    val mimeType = if (pdf) "application/pdf" else "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"\n                    ReportShareUtil.findLatestReportAfter(context, reportPrefix(), mimeType, exportStartedAt).fold(\n                        { resolvedUri -> if (pdf) lastPdfUri = resolvedUri else lastExcelUri = resolvedUri },\n                        { exception -> snackbar.showSnackbar("تم إنشاء التقرير، لكن تعذر ربطه بالمشاركة: ${exception.message ?: "خطأ غير معروف"}") }\n                    )\n                    snackbar.showSnackbar("تم إنشاء التقرير بنجاح.")\n                },\n                { exception -> snackbar.showSnackbar("تعذر إنشاء التقرير: ${exception.message ?: "خطأ غير معروف"}") }\n            )'''
          new = '''            result.fold(\n                { uri ->\n                    if (pdf) lastPdfUri = uri else lastExcelUri = uri\n                    snackbar.showSnackbar("تم إنشاء التقرير بنجاح.")\n                },\n                { exception -> snackbar.showSnackbar("تعذر إنشاء التقرير: ${exception.message ?: "خطأ غير معروف"}") }\n            )'''
          if old not in text:
              raise SystemExit('ReportsScreen verified export block did not match')
          reports.write_text(text.replace(old, new, 1), encoding='utf-8')

          person = root / 'app/src/main/java/com/myaccounts/app/ui/screens/reports/PersonReportScreen.kt'
          text = person.read_text(encoding='utf-8')
          if marker not in text:
              raise SystemExit('PersonReportScreen does not contain the known legacy discovery call')
          text = text.replace('            val exportStartedAt = System.currentTimeMillis()\n', '', 1)
          old = '''            result.onFailure { snackbar.showSnackbar("تعذر إنشاء التقرير.") }.onSuccess {\n                val mimeType = if (pdf) "application/pdf" else "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"\n                val prefix = "MyAccounts_تقرير حساب ${report.personName}"\n                ReportShareUtil.findLatestReportAfter(context, prefix, mimeType, exportStartedAt).fold(\n                    { uri -> if (pdf) { lastPdfUri = uri; lastPdfExportAt = exportStartedAt } else { lastExcelUri = uri; lastExcelExportAt = exportStartedAt } },\n                    { exception -> snackbar.showSnackbar("تم تصدير التقرير، لكن تعذر ربطه بالمشاركة: ${exception.message ?: "خطأ غير معروف"}") }\n                )\n                snackbar.showSnackbar("تم تصدير التقرير بنجاح.")\n            }'''
          new = '''            result.onFailure { snackbar.showSnackbar("تعذر إنشاء التقرير.") }.onSuccess { uri ->\n                if (pdf) { lastPdfUri = uri } else { lastExcelUri = uri }\n                snackbar.showSnackbar("تم تصدير التقرير بنجاح.")\n            }'''
          if old not in text:
              raise SystemExit('PersonReportScreen verified export block did not match')
          text = text.replace(old, new, 1)
          text = text.replace('    var lastPdfExportAt by remember { mutableStateOf<Long?>(null) }\n', '', 1)
          text = text.replace('    var lastExcelExportAt by remember { mutableStateOf<Long?>(null) }\n', '', 1)
          text = text.replace('        lastPdfExportAt = null\n', '', 1)
          text = text.replace('        lastExcelExportAt = null\n', '', 1)
          person.write_text(text, encoding='utf-8')

          for path in exporters:
              text = path.read_text(encoding='utf-8')
              if 'Result<String>' in text or 'Result.success("' in text or 'Result.success(file.absolutePath)' in text:
                  raise SystemExit(f'{path}: final exporter verification failed')

          reports_text = reports.read_text(encoding='utf-8')
          person_text = person.read_text(encoding='utf-8')
          if marker in reports_text or marker in person_text:
              raise SystemExit('Latest-file discovery still exists in report screens')
          if 'fun fileToShareUri(' not in util.read_text(encoding='utf-8'):
              raise SystemExit('FileProvider helper verification failed')

          print('VERIFIED SOURCE MIGRATION PASSED')

      - name: Compile application
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Validate diff
        run: |
          git diff --check
          git diff --stat

      - name: Commit verified migration
        run: |
          if git diff --quiet; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myaccounts/app/util app/src/main/java/com/myaccounts/app/ui/screens/reports
          git commit -m 'fix(reports): pass exported URI directly to sharing [verified-direct-uri]'
          git push
