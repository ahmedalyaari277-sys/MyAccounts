name: Apply one-shot direct report URI migration

on:
  push:
    branches:
      - fix/report-sharing-archive-restore

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate source migration
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          root = Path('.')
          base = root / 'app/src/main/java/com/myaccounts/app'
          util = base / 'util'
          screens = base / 'ui/screens/reports'

          exporter_names = [
              'GeneralReportsPdfExporter.kt',
              'GeneralReportsExcelExporter.kt',
              'MultiCurrencyReportPdfExporter.kt',
              'MultiCurrencyReportExcelExporter.kt',
              'PersonReportPdfExporter.kt',
              'PersonReportExcelExporter.kt',
          ]
          expected_result_counts = {
              'GeneralReportsPdfExporter.kt': 4,
              'GeneralReportsExcelExporter.kt': 4,
              'MultiCurrencyReportPdfExporter.kt': 5,
              'MultiCurrencyReportExcelExporter.kt': 5,
              'PersonReportPdfExporter.kt': 2,
              'PersonReportExcelExporter.kt': 1,
          }

          def replace_one_success_literal(text, name):
              marker = 'Result.success("'
              start = text.find(marker)
              if start < 0 or text.find(marker, start + 1) >= 0:
                  raise SystemExit(f'{name}: expected exactly one string Result.success branch')
              end = text.find('")', start + len(marker))
              if end < 0:
                  raise SystemExit(f'{name}: unterminated Result.success string branch')
              return text[:start] + 'Result.success(uri)' + text[end + 2:]

          for name in exporter_names:
              path = util / name
              text = path.read_text(encoding='utf-8')
              if text.count('Result<String>') != expected_result_counts[name]:
                  raise SystemExit(f'{name}: unexpected Result<String> count; refusing migration')
              if text.count('Result.success("') != 1:
                  raise SystemExit(f'{name}: expected exactly one MediaStore string success branch')
              if text.count('Result.success(file.absolutePath)') != 1:
                  raise SystemExit(f'{name}: expected exactly one legacy absolute-path success branch')
              if 'import android.net.Uri' not in text:
                  anchor = 'import android.content.Context\n'
                  if text.count(anchor) != 1:
                      raise SystemExit(f'{name}: Context import anchor is not unique')
                  text = text.replace(anchor, anchor + 'import android.net.Uri\n', 1)
              if 'import androidx.core.content.FileProvider' not in text:
                  marker = 'import android.net.Uri\n'
                  if text.count(marker) != 1:
                      raise SystemExit(f'{name}: Uri import anchor is not unique')
                  text = text.replace(marker, marker + 'import androidx.core.content.FileProvider\n', 1)
              text = text.replace('Result<String>', 'Result<Uri>')
              text = replace_one_success_literal(text, name)
              text = text.replace('Result.success(file.absolutePath)', 'Result.success(FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file))', 1)
              if 'Result<String>' in text or 'Result.success("' in text or 'Result.success(file.absolutePath)' in text:
                  raise SystemExit(f'{name}: migration residue remains')
              if text.count('Result<Uri>') != expected_result_counts[name]:
                  raise SystemExit(f'{name}: Result<Uri> count is not exact')
              if text.count('Result.success(uri)') != 1:
                  raise SystemExit(f'{name}: expected exactly one MediaStore URI return')
              if text.count('FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file)') != 1:
                  raise SystemExit(f'{name}: expected exactly one legacy FileProvider URI return')
              path.write_text(text, encoding='utf-8')

          reports = screens / 'ReportsScreen.kt'
          text = reports.read_text(encoding='utf-8')
          timestamp = '            val exportStartedAt = System.currentTimeMillis()\n'
          if text.count(timestamp) != 1:
              raise SystemExit('ReportsScreen: export timestamp anchor is not exactly one')
          text = text.replace(timestamp, '', 1)
          old_fold = '''            result.fold(\n                { _ ->\n                    val mimeType = if (pdf) "application/pdf" else "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"\n                    ReportShareUtil.findLatestReportAfter(context, reportPrefix(), mimeType, exportStartedAt).fold(\n                        { resolvedUri -> if (pdf) lastPdfUri = resolvedUri else lastExcelUri = resolvedUri },\n                        { exception -> snackbar.showSnackbar("تم إنشاء التقرير، لكن تعذر ربطه بالمشاركة: ${exception.message ?: "خطأ غير معروف"}") }\n                    )\n                    snackbar.showSnackbar("تم إنشاء التقرير بنجاح.")\n                },\n                { exception -> snackbar.showSnackbar("تعذر إنشاء التقرير: ${exception.message ?: "خطأ غير معروف"}") }\n            )'''
          new_fold = '''            result.fold(\n                { uri ->\n                    if (pdf) lastPdfUri = uri else lastExcelUri = uri\n                    snackbar.showSnackbar("تم إنشاء التقرير بنجاح.")\n                },\n                { exception -> snackbar.showSnackbar("تعذر إنشاء التقرير: ${exception.message ?: "خطأ غير معروف"}") }\n            )'''
          if text.count(old_fold) != 1:
              raise SystemExit('ReportsScreen: exact legacy export/share fold not found')
          text = text.replace(old_fold, new_fold, 1)
          start = '    fun reportPrefix(): String {\n'
          end = '\n    fun export(pdf: Boolean) {'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('ReportsScreen: reportPrefix boundaries are not unique')
          a = text.index(start)
          b = text.index(end)
          text = text[:a] + text[b + 1:]
          if 'ReportShareUtil.findLatestReportAfter' in text or 'exportStartedAt' in text or 'fun reportPrefix()' in text:
              raise SystemExit('ReportsScreen: legacy lookup residue remains')
          reports.write_text(text, encoding='utf-8')

          person = screens / 'PersonReportScreen.kt'
          text = person.read_text(encoding='utf-8')
          if text.count(timestamp) != 1:
              raise SystemExit('PersonReportScreen: export timestamp anchor is not exactly one')
          text = text.replace(timestamp, '', 1)
          old_block = '''            result.onFailure { snackbar.showSnackbar("تعذر إنشاء التقرير.") }.onSuccess {\n                val mimeType = if (pdf) "application/pdf" else "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"\n                val prefix = "MyAccounts_تقرير حساب ${report.personName}"\n                ReportShareUtil.findLatestReportAfter(context, prefix, mimeType, exportStartedAt).fold(\n                    { uri -> if (pdf) { lastPdfUri = uri; lastPdfExportAt = exportStartedAt } else { lastExcelUri = uri; lastExcelExportAt = exportStartedAt } },\n                    { exception -> snackbar.showSnackbar("تم تصدير التقرير، لكن تعذر ربطه بالمشاركة: ${exception.message ?: "خطأ غير معروف"}") }\n                )\n                snackbar.showSnackbar("تم تصدير التقرير بنجاح.")\n            }'''
          new_block = '''            result.onFailure { snackbar.showSnackbar("تعذر إنشاء التقرير.") }.onSuccess { uri ->\n                if (pdf) lastPdfUri = uri else lastExcelUri = uri\n                snackbar.showSnackbar("تم تصدير التقرير بنجاح.")\n            }'''
          if text.count(old_block) != 1:
              raise SystemExit('PersonReportScreen: exact legacy export/share block not found')
          text = text.replace(old_block, new_block, 1)
          for line in [
              '    var lastPdfExportAt by remember { mutableStateOf<Long?>(null) }\n',
              '    var lastExcelExportAt by remember { mutableStateOf<Long?>(null) }\n',
              '        lastPdfExportAt = null\n',
              '        lastExcelExportAt = null\n',
          ]:
              if text.count(line) != 1:
                  raise SystemExit(f'PersonReportScreen: expected state line missing: {line.strip()}')
              text = text.replace(line, '', 1)
          if 'ReportShareUtil.findLatestReportAfter' in text or 'exportStartedAt' in text or 'lastPdfExportAt' in text or 'lastExcelExportAt' in text:
              raise SystemExit('PersonReportScreen: legacy lookup residue remains')
          person.write_text(text, encoding='utf-8')

          workflow = root / '.github/workflows/perform-direct-uri-migration.yml'
          if not workflow.exists():
              raise SystemExit('migration workflow disappeared before final commit')
          workflow.unlink()

          for name in exporter_names:
              text = (util / name).read_text(encoding='utf-8')
              if 'Result<String>' in text or 'Result.success("' in text or 'Result.success(file.absolutePath)' in text:
                  raise SystemExit(f'{name}: final source validation failed')
              if text.count('Result<Uri>') != expected_result_counts[name]:
                  raise SystemExit(f'{name}: final Result<Uri> count mismatch')
              if text.count('Result.success(uri)') != 1 or text.count('FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file)') != 1:
                  raise SystemExit(f'{name}: final direct URI branch validation failed')
          for path in [reports, person]:
              text = path.read_text(encoding='utf-8')
              if 'findLatestReportAfter' in text or 'exportStartedAt' in text:
                  raise SystemExit(f'{path.name}: final legacy lookup validation failed')

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          paths = [str(util / n) for n in exporter_names] + [str(reports), str(person), str(workflow)]
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(reports): return direct share URI from exporters'], check=True)
          subprocess.run(['git', 'push'], check=True)
