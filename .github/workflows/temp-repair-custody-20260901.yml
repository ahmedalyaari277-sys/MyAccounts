name: Temporary custody repair

on:
  push:
    branches:
      - repair/custody-final-settlement-20260901

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          home = Path('app/src/main/java/com/myaccounts/app/ui/screens/HomeScreen.kt')
          text = home.read_text()
          text = text.replace('private enum class PersonSortOrder { LATEST_TRANSACTION, ALPHABETICAL }',
                              'private enum class HomePersonSortOrder { LATEST_TRANSACTION, ALPHABETICAL }')
          text = text.replace('PersonSortOrder.', 'HomePersonSortOrder.')
          home.write_text(text)

          custody = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyOperationsScreen.kt')
          text = custody.read_text()
          text = text.replace('OutlinedTextField(name, { name = it; error = null }, Modifier.fillMaxWidth(), label = { Text("الاسم") }, singleLine = true, enabled = !saving)',
                              'OutlinedTextField(name, { name = it; error = null }, Modifier.fillMaxWidth().semantics { contentDescription = "الاسم" }, label = { Text("الاسم") }, singleLine = true, enabled = !saving)')
          text = text.replace('OutlinedTextField(phone, { phone = it }, Modifier.fillMaxWidth(), label = { Text("الهاتف") }, singleLine = true, enabled = !saving)',
                              'OutlinedTextField(phone, { phone = it }, Modifier.fillMaxWidth().semantics { contentDescription = "الهاتف" }, label = { Text("الهاتف") }, singleLine = true, enabled = !saving)')
          text = text.replace('OutlinedTextField(address, { address = it }, Modifier.fillMaxWidth(), label = { Text("العنوان") }, singleLine = true, enabled = !saving)',
                              'OutlinedTextField(address, { address = it }, Modifier.fillMaxWidth().semantics { contentDescription = "العنوان" }, label = { Text("العنوان") }, singleLine = true, enabled = !saving)')
          text = text.replace('OutlinedTextField(notes, { notes = it }, Modifier.fillMaxWidth(), label = { Text("الملاحظات") }, minLines = 2, enabled = !saving)',
                              'OutlinedTextField(notes, { notes = it }, Modifier.fillMaxWidth().semantics { contentDescription = "الملاحظات" }, label = { Text("الملاحظات") }, minLines = 2, enabled = !saving)')
          text = text.replace('}) { Text(if (saving) "جارٍ الحفظ…" else "حفظ") } },\n        dismissButton = { TextButton(enabled = !saving, onClick = onDismiss) { Text("إلغاء") } }',
                              '}, modifier = Modifier.semantics { contentDescription = "حفظ الشخص" }) { Text(if (saving) "جارٍ الحفظ…" else "حفظ") } },\n        dismissButton = { TextButton(enabled = !saving, onClick = onDismiss) { Text("إلغاء") } }')
          custody.write_text(text)

          screens = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyScreens.kt')
          text = screens.read_text()
          old = 'OperationChoice("مرتجع للجهة / تصفية", type == CustodyTransactionType.RETURNED_TO_ORG)'
          new = 'OperationChoice("مرتجع للجهة", type == CustodyTransactionType.RETURNED_TO_ORG)'
          if old not in text:
              raise SystemExit('Expected organization-return operation choice was not found')
          screens.write_text(text.replace(old, new))
          PY

          git diff --check
          git status --short
          git add app/src/main/java/com/myaccounts/app/ui/screens/HomeScreen.kt \
                  app/src/main/java/com/myaccounts/app/ui/screens/CustodyOperationsScreen.kt \
                  app/src/main/java/com/myaccounts/app/ui/screens/CustodyScreens.kt \
                  .github/workflows/temp-repair-custody-20260901.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(custody): align UI selectors and resolve sort enum collision'
          git rm .github/workflows/temp-repair-custody-20260901.yml
          git commit -m 'chore(ci): remove temporary custody repair workflow'
          git push origin HEAD:repair/custody-final-settlement-20260901