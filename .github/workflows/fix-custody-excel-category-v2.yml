name: Apply custody Excel category compatibility fix v2

on:
  push:
    branches:
      - fix/custody-excel-category-import

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch custody Excel importer/exporter
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/myaccounts/app/util/CustodyExcelDataManager.kt')
          text = path.read_text(encoding='utf-8')

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          once(
              '        "المبلغ",\n        "البيان",\n        "التاريخ"\n    )',
              '        "المبلغ",\n        "البيان",\n        "التاريخ",\n        "التصنيف"\n    )',
              'HEADERS'
          )

          once(
              '        val description: String,\n        val date: Long?\n    )',
              '        val description: String,\n        val date: Long?,\n        val category: String\n    )',
              'Row category field'
          )

          once(
              '                description = transaction.description,\n                date = transaction.transactionDate\n            )',
              '                description = transaction.description,\n                date = transaction.transactionDate,\n                category = transaction.categoryName\n            )',
              'transaction export category'
          )

          no_tx = '                    description = "",\n                    date = null\n                )'
          new_no_tx = '                    description = "",\n                    date = null,\n                    category = ""\n                )'
          count = text.count(no_tx)
          if count != 2:
              raise SystemExit(f'empty export rows: expected 2 occurrences, found {count}')
          text = text.replace(no_tx, new_no_tx)

          once(
              '                        transactionDate = date,\n                        externalId = row.transactionId\n                    )',
              '                        transactionDate = date,\n                        categoryName = row.category,\n                        externalId = row.transactionId\n                    )',
              'transaction import category'
          )

          old_header = '''                                val headers =
                                    (0..19).map {
                                        cells[it].orEmpty()
                                    }

                                require(
                                    headers == HEADERS
                                ) {
                                    "أعمدة ملف Excel للعُهَد غير مطابقة للصيغة المعتمدة."
                                }

                            } else if (rowNumber > 1) {

                                result += row(
                                    rowNumber,
                                    (0..19).map {
                                        cells[it].orEmpty()
                                    }
                                )
'''
          new_header = '''                                val headers =
                                    (0..20).map {
                                        cells[it].orEmpty()
                                    }

                                val currentHeaders = HEADERS
                                val legacyHeaders = HEADERS.dropLast(1)

                                require(
                                    headers == currentHeaders ||
                                        headers.take(20) == legacyHeaders
                                ) {
                                    "أعمدة ملف Excel للعُهَد غير مطابقة للصيغة المعتمدة."
                                }

                            } else if (rowNumber > 1) {

                                result += row(
                                    rowNumber,
                                    (0..20).map {
                                        cells[it].orEmpty()
                                    }
                                )
'''
          once(old_header, new_header, 'header/data parsing')

          once(
              '            date = parseDate(values[19])\n        )',
              '            date = parseDate(values[19]),\n            category = values.getOrNull(20)?.trim().orEmpty()\n        )',
              'row category parsing'
          )

          old_sheet = '''                row.date
                    ?.let {
                        SimpleDateFormat(
                            "yyyy-MM-dd",
                            Locale.US
                        ).format(Date(it))
                    }
                    ?: ""
            )
'''
          new_sheet = '''                row.date
                    ?.let {
                        SimpleDateFormat(
                            "yyyy-MM-dd",
                            Locale.US
                        ).format(Date(it))
                    }
                    ?: "",
                row.category
            )
'''
          once(old_sheet, new_sheet, 'Excel category export')

          path.write_text(text, encoding='utf-8')
          print('CustodyExcelDataManager.kt patched successfully')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myaccounts/app/util/CustodyExcelDataManager.kt
          git diff --cached --check
          git diff --cached -- app/src/main/java/com/myaccounts/app/util/CustodyExcelDataManager.kt
          git commit -m 'fix(excel): preserve custody transaction categories and accept legacy files'
          git push
