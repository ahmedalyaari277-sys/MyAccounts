name: Final Compact Filters Repair
on:
  push:
    paths: ['.github/workflows/_final_compact_filters.yml']
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Apply compact UI repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/myaccounts/app/ui/screens/BackupRestoreScreen.kt')
          s=p.read_text()
          s=s.replace('            SummaryCard(title = "نطاق النسخة") {\n                Text(scope.title, style = androidx.compose.material3.MaterialTheme.typography.titleMedium)\n                Text(\n                    if (scope == BackupScope.ALL) "هذه هي النسخة العامة من الشاشة الرئيسية: الحسابات والعُهَد والعمليات والمرفقات معًا."\n                    else "هذه النسخة مستقلة عن القسم الآخر، والاستعادة لا تستبدل بيانات القسم الآخر.",\n                    style = androidx.compose.material3.MaterialTheme.typography.bodyLarge\n                )\n            }\n\n','')
          s=s.replace('أنشئ ملفًا يحتوي على كامل بيانات النطاق المحدد ومرفقاته.','بيانات النطاق المحدد ومرفقاته.')
          s=s.replace('الاستعادة تستبدل بيانات النطاق المحدد فقط. خذ نسخة آمنة قبل المتابعة.','تستبدل الاستعادة بيانات هذا النطاق فقط.')
          s=s.replace('Spacer(Modifier.height(8.dp))','Spacer(Modifier.height(4.dp))')
          p.write_text(s)
          p=Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyReportsScreen.kt')
          s=p.read_text()
          if 'import androidx.compose.foundation.horizontalScroll' not in s:
              s=s.replace('import androidx.compose.foundation.layout.Arrangement\n','import androidx.compose.foundation.horizontalScroll\nimport androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.layout.Arrangement\n',1)
          # Only rows whose body contains FilterChip are converted; export/button rows remain unchanged.
          pattern=r'Row\(Modifier\.fillMaxWidth\(\), horizontalArrangement = Arrangement\.spacedBy\(8\.dp\)\) \{([^{}]|\{[^{}]*\})*FilterChip([^{}]|\{[^{}]*\})*\}'
          def repl(m):
              return m.group(0).replace('Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {','Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {',1)
          s2=re.sub(pattern,repl,s)
          if s2==s: raise SystemExit('No custody report filter rows matched')
          p.write_text(s2)
          PY
      - name: Build verification
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Commit repairs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/src/main/java/com/myaccounts/app/ui/screens/BackupRestoreScreen.kt app/src/main/java/com/myaccounts/app/ui/screens/CustodyReportsScreen.kt
          git diff --cached --quiet || git commit -m 'fix(ui): compact backup screens and prevent custody report filter clipping'
          git push
