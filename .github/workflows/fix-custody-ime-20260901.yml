name: Final custody keyboard safety fix
on:
  push:
    branches: [repair/custody-final-settlement-20260901]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/custody-final-settlement-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply custody IME safety patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyOperationsScreen.kt')
          s = p.read_text()
          old = 'text = { Column(Modifier.verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(7.dp)) {'
          new = 'text = { Column(Modifier.verticalScroll(rememberScrollState()).imePadding(), verticalArrangement = Arrangement.spacedBy(7.dp)) {'
          if old not in s:
              raise SystemExit('add-person dialog anchor not found')
          s = s.replace(old, new, 1)
          old = 'LazyColumn(Modifier.fillMaxWidth().heightIn(max = 600.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {'
          new = 'LazyColumn(Modifier.fillMaxWidth().heightIn(max = 600.dp).imePadding(), verticalArrangement = Arrangement.spacedBy(10.dp)) {'
          if old not in s:
              raise SystemExit('settlement dialog anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          wf = Path('.github/workflows/fix-custody-ime-20260901.yml')
          wf.unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','.'], check=True)
          subprocess.run(['git','commit','-m','fix(custody): make all remaining dialogs keyboard safe'], check=True)
          subprocess.run(['git','push','origin','repair/custody-final-settlement-20260901'], check=True)
