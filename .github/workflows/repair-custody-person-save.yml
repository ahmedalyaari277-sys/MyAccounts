name: Repair Custody Person Save
on:
  push:
    branches: [feat/custody-module]
    paths:
      - 'REPAIR_CUSTODY_TRIGGER.txt'
      - 'app/src/main/java/com/myaccounts/app/ui/screens/CustodyOperationsScreen.kt'
      - '.github/workflows/repair-custody-person-save.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'chore(custody): remove temporary custody repair workflow'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custody-module
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Patch custody person save flow
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyOperationsScreen.kt')
          s = p.read_text()
          old = '''        onSave = { person ->
            scope.launch {
                personSaving = true
                runCatching { vm.addPersonAndWait(custodyId, person) }.onSuccess { addPerson = false }
                personSaving = false
            }
        }'''
          new = '''        onSave = { person ->
            personSaving = true
            runCatching { vm.addPersonAndWait(custodyId, person) }
                .onSuccess { addPerson = false }
                .also { personSaving = false }
        }'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Verify build and unit tests
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Verify custody UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          avd-name: custody-person-save-repair
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.myaccounts.app.custody.CustodyOperationsUiInstrumentedTest --no-daemon --stacktrace
      - name: Commit verified source repair and clean runner files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f REPAIR_CUSTODY_TRIGGER.txt
          rm -f .github/workflows/repair-custody-final.yml
          git add app/src/main/java/com/myaccounts/app/ui/screens/CustodyOperationsScreen.kt .github/workflows REPAIR_CUSTODY_TRIGGER.txt
          git commit -m "fix(custody): finalize person save flow" || exit 0
          git push origin HEAD:feat/custody-module
