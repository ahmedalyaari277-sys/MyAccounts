name: Finalize custody UI wiring
on:
  push:
    branches: [repair/custody-final-settlement-20260901]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/custody-final-settlement-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply final custody UI wiring
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          def replace_once(path, old, new):
              s = path.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'anchor not found: {path}: {old[:100]}')
              path.write_text(s.replace(old, new, 1))

          led = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyLedgerScreen.kt')
          replace_once(led,
              'import androidx.compose.material.icons.filled.Edit\n',
              'import androidx.compose.material.icons.filled.Edit\nimport androidx.compose.material.icons.filled.MoreVert\n')
          replace_once(led,
              '    var deleting by remember { mutableStateOf<CustodyTransactionEntity?>(null) }\n',
              '    var deleting by remember { mutableStateOf<CustodyTransactionEntity?>(null) }\n    var showOwnerMenu by remember { mutableStateOf(false) }\n    var showEditOwner by remember { mutableStateOf(false) }\n    var showEditCustody by remember { mutableStateOf(false) }\n')
          old = '        topBar = { TopAppBar(title = { Text("عمليات $title", fontWeight = FontWeight.Bold) }, navigationIcon = { IconButton(onClick = onBack) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "رجوع") } }) },'
          new = '''        topBar = { TopAppBar(title = { Text("عمليات $title", fontWeight = FontWeight.Bold) }, navigationIcon = { IconButton(onClick = onBack) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "رجوع") } }, actions = {
            if (owner) {
                IconButton(onClick = { showOwnerMenu = true }) { Icon(Icons.Default.MoreVert, "المزيد") }
                DropdownMenu(expanded = showOwnerMenu, onDismissRequest = { showOwnerMenu = false }) {
                    if (!current.isClosed) {
                        DropdownMenuItem(text = { Text("تعديل بيانات حامل العهدة") }, onClick = { showOwnerMenu = false; showEditOwner = true })
                        DropdownMenuItem(text = { Text("تعديل بيانات العهدة والجهة") }, onClick = { showOwnerMenu = false; showEditCustody = true })
                    }
                }
            }
        } ) },'''
          replace_once(led, old, new)
          marker = '    deleting?.let { t -> AlertDialog(onDismissRequest = { deleting = null }, title = { Text("حذف العملية") }, text = { Text("سيتم حذف العملية نهائيًا.") }, confirmButton = { TextButton(onClick = { vm.deleteTransaction(t.id); deleting = null }) { Text("حذف", color = MaterialTheme.colorScheme.error) } }, dismissButton = { TextButton(onClick = { deleting = null }) { Text("إلغاء") } }) }\n'
          replace_once(led, marker, marker + '    if (showEditOwner) CustodyOwnerEditDialog(vm, current, onDismiss = { showEditOwner = false }, onSaved = { showEditOwner = false })\n    if (showEditCustody) CustodyDataEditDialog(vm, current, onDismiss = { showEditCustody = false }, onSaved = { showEditCustody = false })\n')

          ops = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyOperationsScreen.kt')
          replace_once(ops,
              '    var showPersonSortMenu by remember { mutableStateOf(false) }\n',
              '    var showPersonSortMenu by remember { mutableStateOf(false) }\n    var showEditCustody by remember { mutableStateOf(false) }\n')
          old = '                        DropdownMenuItem(text = { Text("تقرير العهدة") }, onClick = { menu = false; showReport = true })\n'
          new = old + '                        if (!current.isClosed) DropdownMenuItem(text = { Text("تعديل بيانات العهدة والجهة") }, onClick = { menu = false; showEditCustody = true })\n'
          replace_once(ops, old, new)
          marker = '    if (showSettlement) CustodySettlementDialog(vm, current, transactions, people, { showSettlement = false })\n'
          replace_once(ops, marker, marker + '    if (showEditCustody) CustodyDataEditDialog(vm, current, onDismiss = { showEditCustody = false }, onSaved = { showEditCustody = false })\n')

          dlg = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyEditDialogs.kt')
          s = dlg.read_text()
          s = re.sub(r'    var name by remember \{ mutableStateOf\(custody\.name\) \}\n    var organization by remember \{ mutableStateOf\(custody\.organizationName\) \}', '    var organization by remember { mutableStateOf(custody.organizationName) }', s, count=1)
          s = s.replace('            OutlinedTextField(name, { name = it }, Modifier.fillMaxWidth(), label = { Text("اسم العهدة / حامل العهدة") }, singleLine = true, enabled = !saving)\n', '')
          s = s.replace('enabled = name.isNotBlank() && organization.isNotBlank() && !saving', 'enabled = organization.isNotBlank() && !saving')
          s = s.replace('custody.copy(name = name.trim(), organizationName = organization.trim(), organizationPhone = organizationPhone.trim(), organizationAddress = organizationAddress.trim(), organizationNotes = organizationNotes.trim())', 'custody.copy(organizationName = organization.trim(), organizationPhone = organizationPhone.trim(), organizationAddress = organizationAddress.trim(), organizationNotes = organizationNotes.trim())')
          dlg.write_text(s)

          # Clean previous temporary patch workflows; keep only the real source changes.
          for p in [Path('.github/workflows/complete-custody-edit-flows-20260901.yml'), Path('.github/workflows/wire-custody-maintenance-ui-20260901.yml'), Path('.github/workflows/finalize-custody-ui-wiring-20260901.yml')]:
              if p.exists(): p.unlink()

          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','.'], check=True)
          subprocess.run(['git','commit','-m','feat(custody): complete maintenance edit flows'], check=True)
          subprocess.run(['git','push','origin','repair/custody-final-settlement-20260901'], check=True)
