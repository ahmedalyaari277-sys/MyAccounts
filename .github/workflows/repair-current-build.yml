name: Repair current custody build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair source
        shell: bash
        run: |
          set -e
          HOME=app/src/main/java/com/myaccounts/app/ui/screens/CustodyHomeWithArchiveScreen.kt
          LEDGER=app/src/main/java/com/myaccounts/app/ui/screens/CustodyLedgerScreen.kt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyHomeWithArchiveScreen.kt')
          s=p.read_text()
          marker='import androidx.compose.foundation.layout.fillMaxWidth\n'
          if 'import androidx.compose.foundation.layout.imePadding\n' not in s:
              s=s.replace(marker, marker+'import androidx.compose.foundation.layout.imePadding\nimport androidx.compose.foundation.layout.navigationBarsPadding\n')
          p.write_text(s)
          p=Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyLedgerScreen.kt')
          s=p.read_text()
          old='val context = LocalContext.current; val keyboard = LocalSoftwareKeyboardController.current; val calc = LocalCalculatorController.current; val scope = rememberCoroutineScope()'
          new=old+'; val allTransactions by vm.transactions(custodyId).collectAsState()'
          if 'val allTransactions by vm.transactions(custodyId).collectAsState()' not in s:
              if old not in s: raise SystemExit('ledger insertion point not found')
              s=s.replace(old,new,1)
          s=s.replace('remember(transactions) { transactions.map { it.categoryName.trim() }.filter { it.isNotBlank() }.distinct().sorted() }','remember(allTransactions) { allTransactions.map { it.categoryName.trim() }.filter { it.isNotBlank() }.distinct().sorted() }')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$HOME" "$LEDGER"
          git diff --cached --check
          git commit -m 'fix: repair custody keyboard and category compile errors'
          git push