name: Apply custody Excel category compatibility fix v3

on:
  push:
    branches: [fix/custody-excel-category-import]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/myaccounts/app/util/CustodyExcelDataManager.kt')
          s = p.read_text(encoding='utf-8')

          s = s.replace('"التاريخ"\n    )', '"التاريخ",\n        "التصنيف"\n    )', 1)
          s = s.replace('val date: Long?\n    )', 'val date: Long?,\n        val category: String\n    )', 1)
          s = s.replace('date = transaction.transactionDate\n            )', 'date = transaction.transactionDate,\n                category = transaction.categoryName\n            )', 1)
          s = s.replace('description = "",\n                    date = null\n                )', 'description = "",\n                    date = null,\n                    category = ""\n                )')
          s = s.replace('transactionDate = date,\n                        externalId = row.transactionId', 'transactionDate = date,\n                        categoryName = row.category,\n                        externalId = row.transactionId', 1)

          old = '''                                val headers =
                                    (0..19).map {
                                        cells[it].orEmpty()
                                    }

                                require(
                                    headers == HEADERS
                                ) {
                                    "أعمدة ملف Excel للعُهَد غير مطابقة للصيغة المعتمدة."
                                }

                            } else if (rowNumber > 1) {

                                result += row(
                                    rowNumber,
                                    (0..19).map {
                                        cells[it].orEmpty()
                                    }
                                )
'''
          new = '''                                val headers =
                                    (0..20).map {
                                        cells[it].orEmpty()
                                    }

                                val currentHeaders = HEADERS
                                val legacyHeaders = HEADERS.dropLast(1)

                                require(
                                    headers == currentHeaders ||
                                        headers.take(20) == legacyHeaders
                                ) {
                                    "أعمدة ملف Excel للعُهَد غير مطابقة للصيغة المعتمدة."
                                }

                            } else if (rowNumber > 1) {

                                result += row(
                                    rowNumber,
                                    (0..20).map {
                                        cells[it].orEmpty()
                                    }
                                )
'''
          if old not in s:
              raise SystemExit('header parser block not found')
          s = s.replace(old, new, 1)

          s = s.replace('date = parseDate(values[19])\n        )', 'date = parseDate(values[19]),\n            category = values.getOrNull(20)?.trim().orEmpty()\n        )', 1)
          s = s.replace('                    ?: ""\n            )', '                    ?: "",\n                row.category\n            )', 1)

          p.write_text(s, encoding='utf-8')
          print('patched')

      - name: Commit source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/myaccounts/app/util/CustodyExcelDataManager.kt
          git diff --cached --check
          git diff --cached -- app/src/main/java/com/myaccounts/app/util/CustodyExcelDataManager.kt
          git commit -m 'fix(excel): preserve custody categories and accept legacy Excel'
          git push
