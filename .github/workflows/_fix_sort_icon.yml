name: Temporary sort icon compile fix
on:
  push:
    paths:
      - '.github/workflows/_fix_sort_icon.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace unsupported mirrored sort icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyCompactScreenFinal.kt')
          s = p.read_text(encoding='utf-8')
          old = 'Icon(Icons.AutoMirrored.Filled.Sort, null)'
          new = 'Icon(Icons.Default.Sort, null)'
          if old not in s:
              raise SystemExit('Expected unsupported Sort icon reference not found; refusing to modify.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/_fix_sort_icon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myaccounts/app/ui/screens/CustodyCompactScreenFinal.kt .github/workflows/_fix_sort_icon.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use supported sort icon in custody screen'
          git push