name: Implement custody parties and categories

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'repair/custody-final-settlement-20260901'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply custody parties/categories model
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          def text(path):
              return (root / path).read_text(encoding='utf-8')
          def write(path, value):
              (root / path).write_text(value, encoding='utf-8')
          def replace_once(path, old, new):
              p = root / path
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Missing expected text in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 1) Persistent model: parties are PERSON or ENTITY; each custody transaction has a category.
          replace_once('app/src/main/java/com/myaccounts/app/data/custody/CustodyEntities.kt',
              '    val notes: String = "",\n    val createdAt: Long = System.currentTimeMillis(),',
              '    val notes: String = "",\n    val partyType: String = "PERSON",\n    val createdAt: Long = System.currentTimeMillis(),')
          replace_once('app/src/main/java/com/myaccounts/app/data/custody/CustodyEntities.kt',
              '    val amountMinor: Long,\n    val description: String = "",',
              '    val amountMinor: Long,\n    val categoryName: String = "",\n    val description: String = "",')

          # 2) Room migration 15 -> 16 preserves every existing row.
          db = 'app/src/main/java/com/myaccounts/app/data/local/AppDatabase.kt'
          replace_once(db, 'version=15,exportSchema=true', 'version=16,exportSchema=true')
          replace_once(db,
              'MIGRATION_13_14,MIGRATION_14_15).build()',
              'MIGRATION_13_14,MIGRATION_14_15,MIGRATION_15_16).build()')
          replace_once(db,
              'private val MIGRATION_14_15=object:Migration(14,15){override fun migrate(db:SupportSQLiteDatabase){',
              'private val MIGRATION_15_16=object:Migration(15,16){override fun migrate(db:SupportSQLiteDatabase){db.execSQL("ALTER TABLE custody_persons ADD COLUMN partyType TEXT NOT NULL DEFAULT \'PERSON\'");db.execSQL("ALTER TABLE custody_transactions ADD COLUMN categoryName TEXT NOT NULL DEFAULT \'\'")}}\n        private val MIGRATION_14_15=object:Migration(14,15){override fun migrate(db:SupportSQLiteDatabase){')

          # 3) Repository signatures and persistence.
          repo = 'app/src/main/java/com/myaccounts/app/data/custody/CustodyRepository.kt'
          replace_once(repo,
              'suspend fun addTransaction(custodyId: Long, currency: String, type: String, personId: Long?, amountMinor: Long, description: String, date: Long, attachments:',
              'suspend fun addTransaction(custodyId: Long, currency: String, type: String, personId: Long?, amountMinor: Long, categoryName: String, description: String, date: Long, attachments:')
          replace_once(repo,
              'currencyCode = currency, type = type, amountMinor = amountMinor, description = description.trim(), transactionDate = date))',
              'currencyCode = currency, type = type, amountMinor = amountMinor, categoryName = categoryName.trim(), description = description.trim(), transactionDate = date))')
          replace_once(repo,
              'suspend fun updateTransaction(id: Long, currency: String, type: String, personId: Long?, amountMinor: Long, description: String, date: Long, newAttachments:',
              'suspend fun updateTransaction(id: Long, currency: String, type: String, personId: Long?, amountMinor: Long, categoryName: String, description: String, date: Long, newAttachments:')
          replace_once(repo,
              'amountMinor = amountMinor, description = description.trim(), transactionDate = date))',
              'amountMinor = amountMinor, categoryName = categoryName.trim(), description = description.trim(), transactionDate = date))')

          # 4) ViewModel plumbing.
          vm = 'app/src/main/java/com/myaccounts/app/ui/viewmodel/CustodyViewModel.kt'
          replace_once(vm,
              'fun addTransaction(id: Long, currency: String, type: String, personId: Long?, amount: Long, description: String, date: Long, attachments:',
              'fun addTransaction(id: Long, currency: String, type: String, personId: Long?, amount: Long, categoryName: String, description: String, date: Long, attachments:')
          replace_once(vm,
              'repo.addTransaction(id, currency, type, personId, amount, description, date, attachments)',
              'repo.addTransaction(id, currency, type, personId, amount, categoryName, description, date, attachments)')
          replace_once(vm,
              'fun updateTransaction(id: Long, currency: String, type: String, personId: Long?, amount: Long, description: String, date: Long, newAttachments:',
              'fun updateTransaction(id: Long, currency: String, type: String, personId: Long?, amount: Long, categoryName: String, description: String, date: Long, newAttachments:')
          replace_once(vm,
              'repo.updateTransaction(id, currency, type, personId, amount, description, date, newAttachments, deleted)',
              'repo.updateTransaction(id, currency, type, personId, amount, categoryName, description, date, newAttachments, deleted)')
          replace_once(vm,
              'suspend fun addTransactionAndWait(id: Long, currency: String, type: String, personId: Long?, amount: Long, description: String, date: Long, attachments:',
              'suspend fun addTransactionAndWait(id: Long, currency: String, type: String, personId: Long?, amount: Long, categoryName: String, description: String, date: Long, attachments:')
          replace_once(vm,
              '= repo.addTransaction(id, currency, type, personId, amount, description, date, attachments)',
              '= repo.addTransaction(id, currency, type, personId, amount, categoryName, description, date, attachments)')
          replace_once(vm,
              'suspend fun updateTransactionAndWait(id: Long, currency: String, type: String, personId: Long?, amount: Long, description: String, date: Long, newAttachments:',
              'suspend fun updateTransactionAndWait(id: Long, currency: String, type: String, personId: Long?, amount: Long, categoryName: String, description: String, date: Long, newAttachments:')
          replace_once(vm,
              '= repo.updateTransaction(id, currency, type, personId, amount, description, date, newAttachments, deleted)',
              '= repo.updateTransaction(id, currency, type, personId, amount, categoryName, description, date, newAttachments, deleted)')

          # 5) Ledger operation dialog: category is entered with every operation and shown in history.
          led = 'app/src/main/java/com/myaccounts/app/ui/screens/CustodyLedgerScreen.kt'
          replace_once(led,
              'if (t.description.isNotBlank()) Text(t.description, style = MaterialTheme.typography.bodySmall)',
              'if (t.categoryName.isNotBlank()) Text("بند: ${t.categoryName}", style = MaterialTheme.typography.bodySmall, fontWeight = FontWeight.Medium)\n                                if (t.description.isNotBlank()) Text(t.description, style = MaterialTheme.typography.bodySmall)')
          replace_once(led,
              'var details by remember(transaction?.id) { mutableStateOf(transaction?.description ?: "") }',
              'var categoryName by remember(transaction?.id) { mutableStateOf(transaction?.categoryName ?: "") }\n    var details by remember(transaction?.id) { mutableStateOf(transaction?.description ?: "") }')
          replace_once(led,
              'OutlinedTextField(details, { details = it }, Modifier.fillMaxWidth().keepFocusedFieldVisible(), label = { Text("التفاصيل") }, minLines = 1, enabled = !saving)',
              'OutlinedTextField(categoryName, { categoryName = it }, Modifier.fillMaxWidth().keepFocusedFieldVisible().semantics { contentDescription = "بند العهدة" }, label = { Text("بند العهدة") }, singleLine = true, enabled = !saving)\n                OutlinedTextField(details, { details = it }, Modifier.fillMaxWidth().keepFocusedFieldVisible(), label = { Text("التفاصيل") }, minLines = 1, enabled = !saving)')
          replace_once(led,
              'vm.addTransactionAndWait(custodyId, currency, type, personId, parsed, details.trim(), date, selected)',
              'vm.addTransactionAndWait(custodyId, currency, type, personId, parsed, categoryName.trim(), details.trim(), date, selected)')
          replace_once(led,
              'vm.updateTransactionAndWait(transaction.id, currency, type, personId, parsed, details.trim(), date, selected, deletedAttachments)',
              'vm.updateTransactionAndWait(transaction.id, currency, type, personId, parsed, categoryName.trim(), details.trim(), date, selected, deletedAttachments)')

          # 6) Rename the visible grouping from people to parties; keep existing person records intact.
          final = 'app/src/main/java/com/myaccounts/app/ui/screens/CustodyCompactScreenFinal.kt'
          s = text(final)
          s = s.replace('"الأشخاص"', '"الأطراف"')
          s = s.replace('"إضافة شخص"', '"إضافة طرف"')
          s = s.replace('"بحث في الأشخاص"', '"بحث في الأطراف"')
          s = s.replace('"لا يوجد أشخاص في هذه العهدة"', '"لا يوجد أطراف في هذه العهدة"')
          # Insert a compact category summary directly under the party search field.
          anchor = 'item { OutlinedTextField(value = search, onValueChange = { search = it }, modifier = Modifier.fillMaxWidth().semantics { contentDescription = "بحث في الأطراف" }, label = { Text("بحث في الأطراف") }, leadingIcon = { Icon(Icons.Default.Search, null) }, singleLine = true) }'
          if anchor not in s:
              raise SystemExit('Could not find party search anchor in CustodyCompactScreenFinal.kt')
          category_block = '''item {\n                val categories = transactions.map { it.categoryName.trim() }.filter { it.isNotBlank() }.distinct().sorted()\n                if (categories.isNotEmpty()) {\n                    Column(Modifier.fillMaxWidth(), verticalArrangement = Arrangement.spacedBy(4.dp)) {\n                        Text("بنود العهدة", fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)\n                        Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\n                            categories.forEach { category -> SuggestionChip(onClick = {}, label = { Text(category) }) }\n                        }\n                    }\n                }\n            }'''
          s = s.replace(anchor, anchor + '\n            ' + category_block, 1)
          # Party type in add-party dialog.
          s = s.replace('var name by remember { mutableStateOf("") }; var phone by remember { mutableStateOf("") };', 'var name by remember { mutableStateOf("") }; var partyType by remember { mutableStateOf("PERSON") }; var phone by remember { mutableStateOf("") };', 1)
          s = s.replace('Text("إضافة شخص", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold)', 'Text("إضافة طرف", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold)\n            Text("نوع الطرف", fontWeight = FontWeight.Bold)\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\n                FilterChip(selected = partyType == "PERSON", onClick = { partyType = "PERSON" }, label = { Text("شخص") })\n                FilterChip(selected = partyType == "ENTITY", onClick = { partyType = "ENTITY" }, label = { Text("جهة") })\n            }', 1)
          s = s.replace('CustodyPersonEntity(custodyId = custodyId, name = name.trim(), phone = phone.trim(), address = address.trim(), notes = notes.trim())', 'CustodyPersonEntity(custodyId = custodyId, name = name.trim(), phone = phone.trim(), address = address.trim(), notes = notes.trim(), partyType = partyType)', 1)
          write(final, s)

          edit = 'app/src/main/java/com/myaccounts/app/ui/screens/CustodyEditDialogs.kt'
          s = text(edit)
          s = s.replace('var name by remember { mutableStateOf(person.name) }\n    var phone', 'var name by remember { mutableStateOf(person.name) }\n    var partyType by remember { mutableStateOf(person.partyType) }\n    var phone', 1)
          s = s.replace('Column(Modifier.fillMaxWidth().verticalScroll(rememberScrollState()).imePadding(), verticalArrangement = Arrangement.spacedBy(8.dp)) {\n            OutlinedTextField(name', 'Column(Modifier.fillMaxWidth().verticalScroll(rememberScrollState()).imePadding(), verticalArrangement = Arrangement.spacedBy(8.dp)) {\n            Text("نوع الطرف", fontWeight = FontWeight.Bold)\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\n                FilterChip(selected = partyType == "PERSON", onClick = { partyType = "PERSON" }, label = { Text("شخص") })\n                FilterChip(selected = partyType == "ENTITY", onClick = { partyType = "ENTITY" }, label = { Text("جهة") })\n            }\n            OutlinedTextField(name', 1)
          s = s.replace('Text("تعديل بيانات الشخص")', 'Text("تعديل بيانات الطرف")', 1)
          s = s.replace('person.copy(name = name.trim(), phone = phone.trim(), address = address.trim(), notes = notes.trim())', 'person.copy(name = name.trim(), phone = phone.trim(), address = address.trim(), notes = notes.trim(), partyType = partyType)', 1)
          write(edit, s)

          # 7) Compact person card identifies the record as a party without changing balance semantics.
          s = text(final)
          s = s.replace('if (person.phone.isNotBlank()) Text(person.phone, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)', 'Text(if (person.partyType == "ENTITY") "جهة" else "شخص", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n            if (person.phone.isNotBlank()) Text(person.phone, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)', 1)
          write(final, s)

          # 8) Remove stale labels that would expose the old concept in this custody flow.
          for pth in [final, led, edit]:
              p = root / pth
              val = p.read_text(encoding='utf-8')
              val = val.replace('الأشخاص', 'الأطراف').replace('الأشخاص', 'الأطراف')
              val = val.replace('الشخص الجديد', 'الطرف الجديد').replace('الشخص الحالي', 'الطرف الحالي')
              p.write_text(val, encoding='utf-8')

          # 9) Basic static guards: required fields and migration are present exactly once.
          assert 'partyType: String = "PERSON"' in text('app/src/main/java/com/myaccounts/app/data/custody/CustodyEntities.kt')
          assert 'categoryName: String = ""' in text('app/src/main/java/com/myaccounts/app/data/custody/CustodyEntities.kt')
          assert 'MIGRATION_15_16' in text(db)
          assert 'categoryName.trim()' in text(repo)
          assert 'Bند' not in text(led)  # guard against accidental mixed-script corruption

      - name: Verify source consistency
        run: |
          test -f app/src/main/java/com/myaccounts/app/data/custody/CustodyEntities.kt
          test -f app/src/main/java/com/myaccounts/app/data/local/AppDatabase.kt
          test -f app/src/main/java/com/myaccounts/app/ui/screens/CustodyLedgerScreen.kt
          test -f app/src/main/java/com/myaccounts/app/ui/screens/CustodyCompactScreenFinal.kt
          grep -q 'categoryName' app/src/main/java/com/myaccounts/app/data/custody/CustodyEntities.kt
          grep -q 'partyType' app/src/main/java/com/myaccounts/app/data/custody/CustodyEntities.kt
          grep -q 'MIGRATION_15_16' app/src/main/java/com/myaccounts/app/data/local/AppDatabase.kt
          grep -q 'بند العهدة' app/src/main/java/com/myaccounts/app/ui/screens/CustodyLedgerScreen.kt
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myaccounts/app/data/custody/CustodyEntities.kt \
            app/src/main/java/com/myaccounts/app/data/local/AppDatabase.kt \
            app/src/main/java/com/myaccounts/app/data/custody/CustodyRepository.kt \
            app/src/main/java/com/myaccounts/app/ui/viewmodel/CustodyViewModel.kt \
            app/src/main/java/com/myaccounts/app/ui/screens/CustodyLedgerScreen.kt \
            app/src/main/java/com/myaccounts/app/ui/screens/CustodyCompactScreenFinal.kt \
            app/src/main/java/com/myaccounts/app/ui/screens/CustodyEditDialogs.kt
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat(custody): support parties and custody categories'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
