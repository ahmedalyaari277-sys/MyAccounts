name: Apply direct report URI migration

on:
  push:
    paths:
      - '.github/workflows/repair-direct-report-uri.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-sharing-archive-restore
          fetch-depth: 1
      - name: Apply verified URI migration
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          root = Path('.')
          files = [
              root / 'app/src/main/java/com/myaccounts/app/util/GeneralReportsPdfExporter.kt',
              root / 'app/src/main/java/com/myaccounts/app/util/GeneralReportsExcelExporter.kt',
              root / 'app/src/main/java/com/myaccounts/app/util/MultiCurrencyReportPdfExporter.kt',
              root / 'app/src/main/java/com/myaccounts/app/util/MultiCurrencyReportExcelExporter.kt',
              root / 'app/src/main/java/com/myaccounts/app/util/PersonReportPdfExporter.kt',
              root / 'app/src/main/java/com/myaccounts/app/util/PersonReportExcelExporter.kt',
          ]

          def add_imports(s):
              if 'import android.net.Uri' not in s:
                  s = s.replace('import android.content.Context\n', 'import android.content.Context\nimport android.net.Uri\n', 1)
              if 'import androidx.core.content.FileProvider' not in s:
                  marker = 'import java.io.File\n'
                  s = s.replace(marker, 'import androidx.core.content.FileProvider\n' + marker, 1)
              return s

          for p in files:
              s = p.read_text(encoding='utf-8')
              if 'Result<Uri>' in s:
                  continue
              if 'Result<String>' not in s:
                  raise SystemExit(f'Expected Result<String> not found: {p}')
              s = add_imports(s)
              s = s.replace('Result<String>', 'Result<Uri>')

              if p.name == 'GeneralReportsPdfExporter.kt':
                  old = 'Result.success("تم حفظ التقرير في مجلد التنزيلات/MyAccounts")'
                  if s.count(old) != 3: raise SystemExit(f'Unexpected PDF general success count: {s.count(old)}')
                  s = s.replace(old, 'Result.success(uri)', 3)
                  old = 'Result.success(file.absolutePath)'
                  if s.count(old) != 1: raise SystemExit('Missing general PDF legacy result')
                  s = s.replace(old, 'Result.success(FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file))', 1)
              elif p.name == 'GeneralReportsExcelExporter.kt':
                  old = 'Result.success("تم حفظ التقرير في مجلد التنزيلات/MyAccounts")'
                  if s.count(old) != 3: raise SystemExit(f'Unexpected Excel general success count: {s.count(old)}')
                  s = s.replace(old, 'Result.success(uri)', 3)
                  old = 'Result.success(file.absolutePath)'
                  if s.count(old) != 3: raise SystemExit(f'Unexpected Excel legacy success count: {s.count(old)}')
                  s = s.replace(old, 'Result.success(FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file))', 3)
              elif p.name == 'MultiCurrencyReportPdfExporter.kt':
                  old = 'Result.success("تم حفظ تقرير PDF في مجلد التنزيلات/MyAccounts")'
                  if s.count(old) != 1: raise SystemExit('Missing multi PDF Q result')
                  s = s.replace(old, 'Result.success(uri)', 1)
                  old = 'val dir = File(context.getExternalFilesDir(Environment.DIRECTORY_DOCUMENTS), "MyAccounts"); if (!dir.exists() && !dir.mkdirs()) throw IllegalStateException("تعذر إنشاء مجلد التقرير."); File(dir, fileName).also { FileOutputStream(it).use { out -> document.writeTo(out) } }; Result.success("تم حفظ تقرير PDF في مجلد MyAccounts")'
                  if old not in s: raise SystemExit('Missing multi PDF legacy block')
                  new = 'val dir = File(context.getExternalFilesDir(Environment.DIRECTORY_DOCUMENTS), "MyAccounts"); if (!dir.exists() && !dir.mkdirs()) throw IllegalStateException("تعذر إنشاء مجلد التقرير."); val file = File(dir, fileName); FileOutputStream(file).use { out -> document.writeTo(out) }; Result.success(FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file))'
                  s = s.replace(old, new, 1)
              elif p.name == 'MultiCurrencyReportExcelExporter.kt':
                  old = 'Result.success("تم حفظ تقرير Excel في مجلد التنزيلات/MyAccounts")'
                  if s.count(old) != 1: raise SystemExit('Missing multi Excel Q result')
                  s = s.replace(old, 'Result.success(uri)', 1)
                  old = 'File(dir, fileName).also { FileOutputStream(it).use { out -> writeWorkbook(out, sheet) } }\n            Result.success("تم حفظ تقرير Excel في مجلد MyAccounts")'
                  if old not in s: raise SystemExit('Missing multi Excel legacy block')
                  new = 'val file = File(dir, fileName)\n            FileOutputStream(file).use { writeWorkbook(it, sheet) }\n            Result.success(FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file))'
                  s = s.replace(old, new, 1)
              elif p.name == 'PersonReportPdfExporter.kt':
                  old = 'Result.success("تم حفظ تقرير الشخص في مجلد التنزيلات/MyAccounts")'
                  if s.count(old) != 1: raise SystemExit('Missing person PDF Q result')
                  s = s.replace(old, 'Result.success(uri)', 1)
                  old = 'Result.success(file.absolutePath)'
                  if s.count(old) != 1: raise SystemExit('Missing person PDF legacy result')
                  s = s.replace(old, 'Result.success(FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file))', 1)
              elif p.name == 'PersonReportExcelExporter.kt':
                  old = 'Result.success("تم حفظ تقرير Excel في مجلد التنزيلات/MyAccounts")'
                  if s.count(old) != 1: raise SystemExit('Missing person Excel Q result')
                  s = s.replace(old, 'Result.success(uri)', 1)
                  old = 'Result.success(file.absolutePath)'
                  if s.count(old) != 1: raise SystemExit('Missing person Excel legacy result')
                  s = s.replace(old, 'Result.success(FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file))', 1)
              p.write_text(s, encoding='utf-8')

          reports = root / 'app/src/main/java/com/myaccounts/app/ui/screens/reports/ReportsScreen.kt'
          s = reports.read_text(encoding='utf-8')
          if 'findLatestReportAfter' not in s:
              raise SystemExit('ReportsScreen is already migrated or missing expected call')
          s = re.sub(r'\n    fun reportPrefix\(\): String \{.*?\n    \}\n', '\n', s, count=1, flags=re.S)
          s = s.replace('            val exportStartedAt = System.currentTimeMillis()\n', '')
          old = '''                { _ ->
                    val mimeType = if (pdf) "application/pdf" else "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                    ReportShareUtil.findLatestReportAfter(context, reportPrefix(), mimeType, exportStartedAt).fold(
                        { resolvedUri -> if (pdf) lastPdfUri = resolvedUri else lastExcelUri = resolvedUri },
                        { exception -> snackbar.showSnackbar("تم إنشاء التقرير، لكن تعذر ربطه بالمشاركة: ${exception.message ?: "خطأ غير معروف"}") }
                    )
                    snackbar.showSnackbar("تم إنشاء التقرير بنجاح.")
                },'''
          new = '''                { exportedUri ->
                    if (pdf) lastPdfUri = exportedUri else lastExcelUri = exportedUri
                    snackbar.showSnackbar("تم إنشاء التقرير بنجاح.")
                },'''
          if old not in s: raise SystemExit('ReportsScreen success block mismatch')
          s = s.replace(old, new, 1)
          reports.write_text(s, encoding='utf-8')

          person = root / 'app/src/main/java/com/myaccounts/app/ui/screens/reports/PersonReportScreen.kt'
          s = person.read_text(encoding='utf-8')
          if 'findLatestReportAfter' not in s:
              raise SystemExit('PersonReportScreen is already migrated or missing expected call')
          s = s.replace('    var lastPdfExportAt by remember { mutableStateOf<Long?>(null) }\n', '')
          s = s.replace('    var lastExcelExportAt by remember { mutableStateOf<Long?>(null) }\n', '')
          s = s.replace('        lastPdfExportAt = null\n', '')
          s = s.replace('        lastExcelExportAt = null\n', '')
          s = s.replace('            val exportStartedAt = System.currentTimeMillis()\n', '')
          old = '''            result.onFailure { snackbar.showSnackbar("تعذر إنشاء التقرير.") }.onSuccess {
                val mimeType = if (pdf) "application/pdf" else "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                val prefix = "MyAccounts_تقرير حساب ${report.personName}"
                ReportShareUtil.findLatestReportAfter(context, prefix, mimeType, exportStartedAt).fold(
                    { uri -> if (pdf) { lastPdfUri = uri; lastPdfExportAt = exportStartedAt } else { lastExcelUri = uri; lastExcelExportAt = exportStartedAt } },
                    { exception -> snackbar.showSnackbar("تم تصدير التقرير، لكن تعذر ربطه بالمشاركة: ${exception.message ?: "خطأ غير معروف"}") }
                )
                snackbar.showSnackbar("تم تصدير التقرير بنجاح.")
            }'''
          new = '''            result.onFailure { snackbar.showSnackbar("تعذر إنشاء التقرير.") }.onSuccess { uri ->
                if (pdf) lastPdfUri = uri else lastExcelUri = uri
                snackbar.showSnackbar("تم تصدير التقرير بنجاح.")
            }'''
          if old not in s: raise SystemExit('PersonReportScreen success block mismatch')
          s = s.replace(old, new, 1)
          person.write_text(s, encoding='utf-8')

          subprocess.run(['git','diff','--check'], check=True)
          subprocess.run(['git','diff','--exit-code','--','.github/workflows/repair-direct-report-uri.yml'], check=False)
          subprocess.run(['git','status','--short'], check=True)
      - name: Validate migration shape
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "Result<String>" app/src/main/java/com/myaccounts/app/util/GeneralReportsPdfExporter.kt app/src/main/java/com/myaccounts/app/util/GeneralReportsExcelExporter.kt app/src/main/java/com/myaccounts/app/util/MultiCurrencyReportPdfExporter.kt app/src/main/java/com/myaccounts/app/util/MultiCurrencyReportExcelExporter.kt app/src/main/java/com/myaccounts/app/util/PersonReportPdfExporter.kt app/src/main/java/com/myaccounts/app/util/PersonReportExcelExporter.kt
          ! grep -R "findLatestReportAfter" app/src/main/java/com/myaccounts/app/ui/screens/reports/ReportsScreen.kt app/src/main/java/com/myaccounts/app/ui/screens/reports/PersonReportScreen.kt
          grep -R "Result<Uri>" app/src/main/java/com/myaccounts/app/util/GeneralReportsPdfExporter.kt app/src/main/java/com/myaccounts/app/util/GeneralReportsExcelExporter.kt app/src/main/java/com/myaccounts/app/util/MultiCurrencyReportPdfExporter.kt app/src/main/java/com/myaccounts/app/util/MultiCurrencyReportExcelExporter.kt app/src/main/java/com/myaccounts/app/util/PersonReportPdfExporter.kt app/src/main/java/com/myaccounts/app/util/PersonReportExcelExporter.kt
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/myaccounts/app/util app/src/main/java/com/myaccounts/app/ui/screens/reports
          git commit -m "fix(reports): return exported URI directly from exporters"
          git push origin HEAD:fix/report-sharing-archive-restore
