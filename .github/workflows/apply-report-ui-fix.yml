name: Apply report UI fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'fix(reports): correct Result.fold status handling')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Result.fold handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/myaccounts/app/ui/screens/reports/ReportsScreen.kt")
          text = path.read_text(encoding="utf-8")
          old = '''            result.fold(\n                { snackbar.showSnackbar("تعذر إنشاء التقرير.") },\n                { snackbar.showSnackbar("تم إنشاء التقرير بنجاح.") }\n            )'''
          new = '''            result.fold(\n                { snackbar.showSnackbar("تم إنشاء التقرير بنجاح.") },\n                { snackbar.showSnackbar("تعذر إنشاء التقرير.") }\n            )'''
          if old not in text:
              raise SystemExit("Expected Result.fold block was not found; refusing to modify the repository.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/myaccounts/app/ui/screens/reports/ReportsScreen.kt .github/workflows/apply-report-ui-fix.yml
          git rm .github/workflows/apply-report-ui-fix.yml
          git commit -m "fix(reports): correct Result.fold status handling"
          git push
