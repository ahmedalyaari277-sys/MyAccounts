name: Apply direct report URI migration

on:
  push:
    branches:
      - fix/report-sharing-archive-restore
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/report-sharing-archive-restore
          fetch-depth: 0

      - name: Apply verified direct URI migration
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd()
          files = [
              "app/src/main/java/com/myaccounts/app/util/GeneralReportsPdfExporter.kt",
              "app/src/main/java/com/myaccounts/app/util/GeneralReportsExcelExporter.kt",
              "app/src/main/java/com/myaccounts/app/util/MultiCurrencyReportPdfExporter.kt",
              "app/src/main/java/com/myaccounts/app/util/MultiCurrencyReportExcelExporter.kt",
              "app/src/main/java/com/myaccounts/app/util/PersonReportPdfExporter.kt",
              "app/src/main/java/com/myaccounts/app/util/PersonReportExcelExporter.kt",
          ]
          expected_counts = {files[0]:4,files[1]:4,files[2]:5,files[3]:5,files[4]:2,files[5]:2}
          def add_uri_import(text):
              if "import android.net.Uri" not in text:
                  marker="import android.content.Context\n"
                  if marker not in text: raise SystemExit("Missing Context import")
                  text=text.replace(marker,marker+"import android.net.Uri\n",1)
              return text
          def migrate_exporter(rel):
              path=root/rel; text=path.read_text(encoding="utf-8")
              count=text.count("Result<String>")
              if count!=expected_counts[rel]: raise SystemExit(f"{rel}: expected {expected_counts[rel]} Result<String>, found {count}")
              text=add_uri_import(text).replace("Result<String>","Result<Uri>")
              q=re.compile(r'Result\.success\("([^"]*)"\)'); matches=list(q.finditer(text))
              if len(matches)!=2: raise SystemExit(f"{rel}: expected 2 save success messages, found {len(matches)}")
              first=matches[0]; text=text[:first.start()]+"Result.success(uri)"+text[first.end():]
              matches=list(q.finditer(text))
              if len(matches)!=1: raise SystemExit(f"{rel}: expected 1 legacy success message after Q migration")
              second=matches[0]; before=text[:second.start()]; after=text[second.end():]; legacy=before[before.rfind("else"):]
              if "File(dir, fileName).also" in legacy:
                  pos=before.rfind("File(dir, fileName).also"); before=before[:pos]+"val file = File(dir, fileName).also"+before[pos+len("File(dir, fileName).also"):]
              elif "val file = File(dir, fileName)" not in legacy:
                  raise SystemExit(f"{rel}: legacy output file variable not found")
              text=before+"Result.success(Uri.fromFile(file))"+after
              path.write_text(text,encoding="utf-8")
          for rel in files: migrate_exporter(rel)

          reports=root/"app/src/main/java/com/myaccounts/app/ui/screens/reports/ReportsScreen.kt"; text=reports.read_text(encoding="utf-8")
          if text.count("findLatestReportAfter")!=1: raise SystemExit("ReportsScreen: expected one legacy lookup")
          text=text.replace("            val exportStartedAt = System.currentTimeMillis()\n","",1)
          old='''            result.fold(\n                { _ ->\n                    val mimeType = if (pdf) "application/pdf" else "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"\n                    ReportShareUtil.findLatestReportAfter(context, reportPrefix(), mimeType, exportStartedAt).fold(\n                        { resolvedUri -> if (pdf) lastPdfUri = resolvedUri else lastExcelUri = resolvedUri },\n                        { exception -> snackbar.showSnackbar("تم إنشاء التقرير، لكن تعذر ربطه بالمشاركة: ${exception.message ?: "خطأ غير معروف"}") }\n                    )\n                    snackbar.showSnackbar("تم إنشاء التقرير بنجاح.")\n                },\n                { exception -> snackbar.showSnackbar("تعذر إنشاء التقرير: ${exception.message ?: "خطأ غير معروف"}") }\n            )'''
          new='''            result.fold(\n                { uri ->\n                    if (pdf) lastPdfUri = uri else lastExcelUri = uri\n                    snackbar.showSnackbar("تم إنشاء التقرير بنجاح.")\n                },\n                { exception -> snackbar.showSnackbar("تعذر إنشاء التقرير: ${exception.message ?: "خطأ غير معروف"}") }\n            )'''
          if old not in text: raise SystemExit("ReportsScreen: exact export block not found")
          reports.write_text(text.replace(old,new,1),encoding="utf-8")

          person=root/"app/src/main/java/com/myaccounts/app/ui/screens/reports/PersonReportScreen.kt"; text=person.read_text(encoding="utf-8")
          if text.count("findLatestReportAfter")!=1: raise SystemExit("PersonReportScreen: expected one legacy lookup")
          text=text.replace("            val exportStartedAt = System.currentTimeMillis()\n","",1)
          old='''            result.onFailure { snackbar.showSnackbar("تعذر إنشاء التقرير.") }.onSuccess {\n                val mimeType = if (pdf) "application/pdf" else "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"\n                val prefix = "MyAccounts_تقرير حساب ${report.personName}"\n                ReportShareUtil.findLatestReportAfter(context, prefix, mimeType, exportStartedAt).fold(\n                    { uri -> if (pdf) { lastPdfUri = uri; lastPdfExportAt = exportStartedAt } else { lastExcelUri = uri; lastExcelExportAt = exportStartedAt } },\n                    { exception -> snackbar.showSnackbar("تم تصدير التقرير، لكن تعذر ربطه بالمشاركة: ${exception.message ?: "خطأ غير معروف"}") }\n                )\n                snackbar.showSnackbar("تم تصدير التقرير بنجاح.")\n            }'''
          new='''            result.onFailure { snackbar.showSnackbar("تعذر إنشاء التقرير.") }.onSuccess { uri ->\n                if (pdf) { lastPdfUri = uri; lastPdfExportAt = System.currentTimeMillis() } else { lastExcelUri = uri; lastExcelExportAt = System.currentTimeMillis() }\n                snackbar.showSnackbar("تم تصدير التقرير بنجاح.")\n            }'''
          if old not in text: raise SystemExit("PersonReportScreen: exact export block not found")
          person.write_text(text.replace(old,new,1),encoding="utf-8")

          share=root/"app/src/main/java/com/myaccounts/app/util/ReportShareUtil.kt"; text=share.read_text(encoding="utf-8")
          old='''    fun shareReport(context: Context, uri: Uri, mimeType: String): Result<Unit> = try {\n        val intent = Intent(Intent.ACTION_SEND).apply {\n            type = mimeType\n            putExtra(Intent.EXTRA_STREAM, uri)\n            clipData = ClipData.newRawUri("MyAccounts report", uri)\n            addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)\n        }\n        val chooser = Intent.createChooser(intent, "مشاركة التقرير").apply {\n            addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)\n            addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)\n        }\n        context.packageManager.queryIntentActivities(intent, 0).forEach { info -> context.grantUriPermission(info.activityInfo.packageName, uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) }\n        context.startActivity(chooser)\n        Result.success(Unit)\n    } catch (exception: Exception) { Result.failure(exception) }'''
          new='''    fun shareReport(context: Context, uri: Uri, mimeType: String): Result<Unit> = try {\n        val shareUri = if (uri.scheme == "file") {\n            val path = uri.path ?: throw IllegalArgumentException("مسار ملف التقرير غير صالح.")\n            FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", File(path))\n        } else uri\n        val intent = Intent(Intent.ACTION_SEND).apply {\n            type = mimeType\n            putExtra(Intent.EXTRA_STREAM, shareUri)\n            clipData = ClipData.newRawUri("MyAccounts report", shareUri)\n            addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)\n        }\n        val chooser = Intent.createChooser(intent, "مشاركة التقرير").apply {\n            addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)\n            addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)\n        }\n        context.packageManager.queryIntentActivities(intent, 0).forEach { info -> context.grantUriPermission(info.activityInfo.packageName, shareUri, Intent.FLAG_GRANT_READ_URI_PERMISSION) }\n        context.startActivity(chooser)\n        Result.success(Unit)\n    } catch (exception: Exception) { Result.failure(exception) }'''
          if old not in text: raise SystemExit("ReportShareUtil: exact share block not found")
          share.write_text(text.replace(old,new,1),encoding="utf-8")

          for rel in files:
              text=(root/rel).read_text(encoding="utf-8")
              if "Result<String>" in text or text.count("Result.success(uri)")!=1 or "Result.success(Uri.fromFile(file))" not in text: raise SystemExit(f"Verification failed: {rel}")
          if "findLatestReportAfter" in reports.read_text(encoding="utf-8"): raise SystemExit("Verification failed: ReportsScreen lookup remains")
          if "findLatestReportAfter" in person.read_text(encoding="utf-8"): raise SystemExit("Verification failed: PersonReportScreen lookup remains")

          subprocess.run(["git","config","user.name","github-actions[bot]"],check=True); subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"],check=True)
          subprocess.run(["git","add",*[str(root/p) for p in files],str(reports),str(person),str(share)],check=True)
          subprocess.run(["git","commit","-m","fix(reports): return exact exported URI for sharing"],check=True)
          subprocess.run(["git","push","origin","HEAD:fix/report-sharing-archive-restore"],check=True)

      - name: Remove migration workflow from final branch
        if: success()
        run: |
          git fetch origin fix/report-sharing-archive-restore
          git checkout fix/report-sharing-archive-restore
          if [ -f .github/workflows/direct-uri-migration.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/direct-uri-migration.yml
            git commit -m "chore(ci): remove one-time URI migration workflow"
            git push origin HEAD:fix/report-sharing-archive-restore
          fi
