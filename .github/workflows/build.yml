name: Build Android APK
on:
  push:
    branches:
      - "main"
      - "master"
      - "fix/reports-import-attachment-ui"
      - "feat/custody-module"
      - "repair/custody-final-20260831"
      - "repair/custody-ui-final-20260831"
      - "repair/custody-final-settlement-20260901"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Run debug unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myaccounts-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
