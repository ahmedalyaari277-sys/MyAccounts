name: Build Android APK
on:
  push:
    branches:
      - "main"
      - "master"
      - "fix/reports-import-attachment-ui"
      - "feat/custody-module"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Apply custody UI regression repair
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'fix(custody): stabilize person save and operation dialogs')
        shell: python
        run: |
          from pathlib import Path

          ops = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyOperationsScreen.kt')
          s = ops.read_text()
          old = '''        onSave = { person ->
            scope.launch {
                personSaving = true
                runCatching { vm.addPersonAndWait(custodyId, person) }.onSuccess { addPerson = false }
                personSaving = false
            }
        }'''
          new = '''        onSave = { person ->
            personSaving = true
            runCatching { vm.addPersonAndWait(custodyId, person) }.onSuccess { addPerson = false }
            personSaving = false
        }'''
          if old not in s:
              raise SystemExit('person save block not found')
          s = s.replace(old, new, 1)
          s = s.replace('    val scope = rememberCoroutineScope()\n    val matches = existing.filter', '    val matches = existing.filter', 1)
          old = 'properties = DialogProperties(usePlatformDefaultWidth = false, decorFitsSystemWindows = false)'
          if old not in s:
              raise SystemExit('custody operation dialog properties not found')
          s = s.replace(old, 'properties = DialogProperties(usePlatformDefaultWidth = false)', 1)
          ops.write_text(s)

          person_ops = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyPersonOperationsScreen.kt')
          s = person_ops.read_text()
          old = 'properties = DialogProperties(usePlatformDefaultWidth = false, decorFitsSystemWindows = false)'
          if old not in s:
              raise SystemExit('person operation dialog properties not found')
          s = s.replace(old, 'properties = DialogProperties(usePlatformDefaultWidth = false)', 1)
          person_ops.write_text(s)

      - name: Commit custody UI repair
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'fix(custody): stabilize person save and operation dialogs')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/myaccounts/app/ui/screens/CustodyOperationsScreen.kt app/src/main/java/com/myaccounts/app/ui/screens/CustodyPersonOperationsScreen.kt
          git commit -m "fix(custody): stabilize person save and operation dialogs"
          git push origin HEAD:main

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myaccounts-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk