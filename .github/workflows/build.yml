name: Build Android APK

on:
  push:
    branches:
      - "main"
      - "master"

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # 1. تنزيل المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # 3. إعداد Gradle
      #
      # نستخدم Gradle 8.2 لأنه متوافق
      # مع Android Gradle Plugin 8.2.2
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      # 4. بناء التطبيق
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # 5. رفع ملف APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myaccounts-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
