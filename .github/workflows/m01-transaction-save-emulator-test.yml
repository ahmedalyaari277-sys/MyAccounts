name: M-01 Transaction Save Emulator Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/myaccounts/app/data/local/**'
      - 'app/src/main/java/com/myaccounts/app/data/repository/TransactionRepository.kt'
      - 'app/src/main/java/com/myaccounts/app/ui/screens/HomeScreen.kt'
      - 'app/src/main/java/com/myaccounts/app/ui/screens/PersonAccountScreen.kt'
      - 'app/src/main/java/com/myaccounts/app/ui/screens/QuickTransactionScreen.kt'
      - 'app/src/main/java/com/myaccounts/app/ui/screens/TransactionScreen.kt'
      - 'app/src/main/java/com/myaccounts/app/ui/viewmodel/TransactionViewModel.kt'
      - 'app/src/androidTest/java/com/myaccounts/app/TransactionSaveRegressionTest.kt'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/m01-transaction-save-emulator-test.yml'

jobs:
  m01-transaction-save-emulator-test:
    name: M-01 Transaction save on emulator
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Gradle project and M-01 sources
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/androidTest/java/com/myaccounts/app/TransactionSaveRegressionTest.kt
          gradle --version

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm

      - name: Run M-01 transaction save test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          avd-name: m01-test
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          disable-linux-hw-accel: false
          pre-emulator-launch-script: adb start-server
          script: |
            cd "$GITHUB_WORKSPACE"
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.myaccounts.app.TransactionSaveRegressionTest --no-daemon --stacktrace

      - name: Upload M-01 instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-transaction-save-emulator-results
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
