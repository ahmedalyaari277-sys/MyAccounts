name: Apply Pending UI Repairs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(ui):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply UI repairs
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          def edit(path, fn):
              p = root / path
              s = p.read_text(encoding='utf-8')
              n = fn(s)
              if n == s:
                  raise SystemExit(f'NO CHANGE: {path}')
              p.write_text(n, encoding='utf-8')
              print('UPDATED', path)

          def replace_once(s, old, new, path):
              if old not in s:
                  raise SystemExit(f'PATTERN NOT FOUND: {path}')
              if s.count(old) != 1:
                  raise SystemExit(f'PATTERN NOT UNIQUE: {path} count={s.count(old)}')
              return s.replace(old, new)

          # 1) Custody home: match the accounts home sort control and move + to the same visual FAB treatment.
          def custody_home(s):
              s = replace_once(s,
                  'import androidx.compose.material.icons.filled.MoreVert\n',
                  'import androidx.compose.material.icons.filled.MoreVert\nimport androidx.compose.material.icons.filled.Sort\n',
                  'CustodyHomeWithArchiveScreen.kt')
              s = replace_once(s,
                  'private val custodyHomeCurrencies = listOf("YER", "SAR", "USD")\n',
                  'private val custodyHomeCurrencies = listOf("YER", "SAR", "USD")\n\nprivate enum class CustodySortOrder { LATEST_TRANSACTION, ALPHABETICAL }\n',
                  'CustodyHomeWithArchiveScreen.kt')
              s = replace_once(s,
                  '    var adding by remember { mutableStateOf(false) }\n    var showMoreMenu by remember { mutableStateOf(false) }\n',
                  '    var adding by remember { mutableStateOf(false) }\n    var sortOrder by remember { mutableStateOf(CustodySortOrder.LATEST_TRANSACTION) }\n    var showSortMenu by remember { mutableStateOf(false) }\n    var showMoreMenu by remember { mutableStateOf(false) }\n\n    val displayedCustodies = when (sortOrder) {\n        CustodySortOrder.LATEST_TRANSACTION -> custodies\n        CustodySortOrder.ALPHABETICAL -> custodies.sortedBy { it.name.trim().lowercase() }\n    }\n',
                  'CustodyHomeWithArchiveScreen.kt')
              s = replace_once(s,
                  '                    IconButton(onClick = onReports) { Icon(Icons.Default.Assessment, "التقارير") }\n                    IconButton(onClick = { showMoreMenu = true }) { Icon(Icons.Default.MoreVert, "المزيد من الخيارات") }\n',
                  '                    IconButton(onClick = onReports) { Icon(Icons.Default.Assessment, "التقارير") }\n                    Box {\n                        IconButton(onClick = { showSortMenu = true }) { Icon(Icons.Default.Sort, "ترتيب العُهَد") }\n                        DropdownMenu(expanded = showSortMenu, onDismissRequest = { showSortMenu = false }) {\n                            DropdownMenuItem(text = { Text("حسب أحدث عملية") }, onClick = { sortOrder = CustodySortOrder.LATEST_TRANSACTION; showSortMenu = false })\n                            DropdownMenuItem(text = { Text("حسب الأبجدية") }, onClick = { sortOrder = CustodySortOrder.ALPHABETICAL; showSortMenu = false })\n                        }\n                    }\n                    IconButton(onClick = { showMoreMenu = true }) { Icon(Icons.Default.MoreVert, "المزيد من الخيارات") }\n',
                  'CustodyHomeWithArchiveScreen.kt')
              s = replace_once(s, 'items(custodies, key = { it.id }) { custody ->', 'items(displayedCustodies, key = { it.id }) { custody ->', 'CustodyHomeWithArchiveScreen.kt')
              old = '            FloatingActionButton(onClick = { adding = true }) { Icon(Icons.Default.Add, "إضافة عهدة") }'
              new = '            FloatingActionButton(\n                onClick = { adding = true },\n                modifier = Modifier.padding(16.dp).size(56.dp),\n                containerColor = MaterialTheme.colorScheme.primary,\n                contentColor = MaterialTheme.colorScheme.onPrimary,\n                shape = MaterialTheme.shapes.large\n            ) { Icon(Icons.Default.Add, "إضافة عهدة") }'
              s = replace_once(s, old, new, 'CustodyHomeWithArchiveScreen.kt')
              return s
          edit('app/src/main/java/com/myaccounts/app/ui/screens/CustodyHomeWithArchiveScreen.kt', custody_home)

          # 2) Custody detail: remove duplicate add controls and use one bottom-left FAB, while retaining quick-operation + buttons inside cards.
          def custody_detail(s):
              old = '            if (!current.isClosed) IconButton(onClick = { addPerson = true }, modifier = Modifier.semantics { contentDescription = "إضافة طرف" }) { Icon(Icons.Default.Add, contentDescription = "إضافة طرف") }\n'
              s = replace_once(s, old, '', 'CustodyCompactScreenFinal.kt')
              old = '                    CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {\n                        Row(Modifier.width(176.dp).height(48.dp), horizontalArrangement = Arrangement.Start, verticalAlignment = Alignment.CenterVertically) {\n                            IconButton(onClick = { sortMenu = true }, modifier = Modifier.size(48.dp).semantics { contentDescription = "ترتيب الأطراف" }) { Icon(Icons.Default.Sort, null) }\n                            TextButton(enabled = !current.isClosed, onClick = { addPerson = true }, modifier = Modifier.width(112.dp).height(48.dp).semantics { contentDescription = "إضافة طرف" }) { Icon(Icons.Default.Add, null); Spacer(Modifier.width(2.dp)); Text("إضافة", maxLines = 1) }\n                        }\n                    }'
              new = '                    CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {\n                        IconButton(onClick = { sortMenu = true }, modifier = Modifier.size(48.dp).semantics { contentDescription = "ترتيب الأطراف" }) { Icon(Icons.Default.Sort, null) }\n                    }'
              s = replace_once(s, old, new, 'CustodyCompactScreenFinal.kt')
              marker = '        })\n    }) { padding ->\n'
              insert = '        },\n        floatingActionButton = {\n            FloatingActionButton(\n                onClick = { if (!current.isClosed) addPerson = true },\n                modifier = Modifier.padding(16.dp).size(56.dp),\n                containerColor = MaterialTheme.colorScheme.primary,\n                contentColor = MaterialTheme.colorScheme.onPrimary,\n                shape = MaterialTheme.shapes.large\n            ) { Icon(Icons.Default.Add, "إضافة طرف") }\n        }\n    ) { padding ->\n'
              s = replace_once(s, marker, insert, 'CustodyCompactScreenFinal.kt')
              return s
          edit('app/src/main/java/com/myaccounts/app/ui/screens/CustodyCompactScreenFinal.kt', custody_detail)

          # 3) Category typing: never open the popup while the user is typing; popup selection must not steal the field focus.
          def org_category(s):
              old = 'OutlinedTextField(category, { category = it; categoryMenu = true }, Modifier.fillMaxWidth().orgKeepFocusedVisible(), label = { Text("اختر تصنيفًا أو اكتب تصنيفًا جديدًا") }, singleLine = true, enabled = !saving)'
              new = 'OutlinedTextField(category, { category = it; categoryMenu = false }, Modifier.fillMaxWidth().orgKeepFocusedVisible(), label = { Text("اختر تصنيفًا أو اكتب تصنيفًا جديدًا") }, singleLine = true, enabled = !saving)'
              return replace_once(s, old, new, 'CustodyOrganizationOperationsScreen.kt')
          edit('app/src/main/java/com/myaccounts/app/ui/screens/CustodyOrganizationOperationsScreen.kt', org_category)

          # 4) Backup/restore: compact all three scopes without changing backup/restore logic.
          def backup(s):
              s = s.replace('verticalArrangement = Arrangement.spacedBy(12.dp),', 'verticalArrangement = Arrangement.spacedBy(8.dp),', 1)
              s = s.replace('.padding(16.dp).verticalScroll(rememberScrollState()),', '.padding(horizontal = 12.dp, vertical = 8.dp).verticalScroll(rememberScrollState()),', 1)
              s = re.sub(r'\n            SummaryCard\(title = "نطاق النسخة"\) \{.*?\n            \}\n\n            InformationCard', '\n            InformationCard', s, count=1, flags=re.S)
              for text in [
                  'هذه هي النسخة العامة من الشاشة الرئيسية: الحسابات والعُهَد والعمليات والمرفقات معًا.',
                  'هذه النسخة مستقلة عن القسم الآخر، والاستعادة لا تستبدل بيانات القسم الآخر.',
                  'أنشئ ملفًا يحتوي على كامل بيانات النطاق المحدد ومرفقاته.',
                  'اختر مجلدًا للمزامنة.',
                  'تم اختيار مجلد للمزامنة.',
                  'الاستعادة تستبدل بيانات النطاق المحدد فقط. خذ نسخة آمنة قبل المتابعة.'
              ]:
                  s = s.replace(f'                Text("{text}", style = androidx.compose.material3.MaterialTheme.typography.bodyLarge)\n', '')
                  s = s.replace(f'                Text("{text}", style = androidx.compose.material3.MaterialTheme.typography.bodySmall, color = androidx.compose.material3.MaterialTheme.colorScheme.onSurfaceVariant)\n', '')
                  s = s.replace(f'                Text("{text}", style = androidx.compose.material3.MaterialTheme.typography.bodySmall, color = androidx.compose.material3.MaterialTheme.colorScheme.error)\n', '')
              return s
          edit('app/src/main/java/com/myaccounts/app/ui/screens/BackupRestoreScreen.kt', backup)

          # 5) General person account: combine person data + balances into one compact horizontal card and move add operation to the same FAB pattern as custody.
          def person_account(s):
              s = replace_once(s, 'import androidx.compose.foundation.layout.Arrangement\n', 'import androidx.compose.foundation.layout.Arrangement\nimport androidx.compose.foundation.layout.Box\n', 'PersonAccountScreen.kt')
              s = replace_once(s, 'import androidx.compose.material3.DangerButton\n', 'import androidx.compose.material3.DangerButton\nimport androidx.compose.material3.FloatingActionButton\n', 'PersonAccountScreen.kt')
              s = replace_once(s, 'import androidx.compose.ui.unit.dp\n', 'import androidx.compose.ui.unit.dp\n', 'PersonAccountScreen.kt')
              old = '''            SummaryCard(title = "بيانات الشخص") {\n                Text(\n                    person.name,\n                    style = MaterialTheme.typography.titleLarge,\n                    fontWeight = FontWeight.Bold,\n                    color = MaterialTheme.colorScheme.onSurface\n                )\n                if (person.phone.isNotBlank()) {\n                    Text(\n                        "الهاتف: ${person.phone}",\n                        style = MaterialTheme.typography.bodyLarge,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                }\n                if (person.address.isNotBlank()) {\n                    Text(\n                        "العنوان: ${person.address}",\n                        style = MaterialTheme.typography.bodyLarge,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                }\n                if (person.notes.isNotBlank()) {\n                    Text(\n                        "الملاحظات: ${person.notes}",\n                        style = MaterialTheme.typography.bodySmall,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                }\n            }\n\n            if (accounts.isNotEmpty()) {\n                SummaryCard(title = "ملخص الأرصدة") {\n                    accounts.sortedBy { currencyOrder(it.currencyCode) }.forEach { account ->\n                        BalanceAmount(\n                            amount = formatBalance(account.balanceMinor),\n                            status = balanceStatus(account.balanceMinor),\n                            label = account.currencyCode,\n                            modifier = Modifier.fillMaxWidth()\n                        )\n                    }\n                }\n            }\n'''
              new = '''            InformationCard {\n                Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp), verticalAlignment = Alignment.Top) {\n                    Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(2.dp)) {\n                        Text(person.name, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)\n                        if (person.phone.isNotBlank()) Text("الهاتف: ${person.phone}", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n                        if (person.address.isNotBlank()) Text("العنوان: ${person.address}", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant, maxLines = 2)\n                        if (person.notes.isNotBlank()) Text("الملاحظات: ${person.notes}", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant, maxLines = 2)\n                    }\n                    if (accounts.isNotEmpty()) {\n                        Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(2.dp)) {\n                            Text("الأرصدة", style = MaterialTheme.typography.labelLarge, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)\n                            accounts.sortedBy { currencyOrder(it.currencyCode) }.forEach { account ->\n                                Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {\n                                    Text(account.currencyCode, style = MaterialTheme.typography.labelMedium, fontWeight = FontWeight.Bold)\n                                    BalanceAmount(amount = formatBalance(account.balanceMinor), status = balanceStatus(account.balanceMinor), label = "")\n                                }\n                            }\n                        }\n                    }\n                }\n            }\n'''
              s = replace_once(s, old, new, 'PersonAccountScreen.kt')
              old = '''            if (initialAccount != null) {\n                TransactionScreen(\n                    accountId = initialAccount.id,\n                    currencyCode = initialAccount.currencyCode,\n                    accounts = accounts,\n                    onBack = {},\n                    transactionViewModel = transactionViewModel,\n                    embedded = true,\n                    modifier = Modifier.weight(1f),\n                    personName = person.name\n                )\n            } else {\n                InformationCard(modifier = Modifier.weight(1f)) {\n                    Text(\n                        "لا توجد حسابات عملات لهذا الشخص.",\n                        style = MaterialTheme.typography.bodyLarge\n                    )\n                }\n            }\n'''
              new = '''            Box(Modifier.weight(1f).fillMaxWidth()) {\n                if (initialAccount != null) {\n                    TransactionScreen(\n                        accountId = initialAccount.id,\n                        currencyCode = initialAccount.currencyCode,\n                        accounts = accounts,\n                        onBack = {},\n                        transactionViewModel = transactionViewModel,\n                        embedded = true,\n                        modifier = Modifier.fillMaxSize(),\n                        personName = person.name\n                    )\n                } else {\n                    InformationCard(Modifier.fillMaxSize()) {\n                        Text("لا توجد حسابات عملات لهذا الشخص.", style = MaterialTheme.typography.bodyLarge)\n                    }\n                }\n                FloatingActionButton(\n                    onClick = { if (initialAccount != null) transactionViewModel /* keep state local to TransactionScreen */ },\n                    modifier = Modifier.align(Alignment.BottomEnd).padding(16.dp),\n                    containerColor = MaterialTheme.colorScheme.primary,\n                    contentColor = MaterialTheme.colorScheme.onPrimary,\n                    shape = MaterialTheme.shapes.large\n                ) {\n                    Icon(androidx.compose.material.icons.Icons.Default.Add, "إضافة عملية")\n                }\n            }\n'''
              # Do not introduce a second add path here; TransactionScreen owns the dialog. Instead keep its embedded button hidden by a dedicated flag below.
              # Replace the attempted FAB block with a callback-driven local add state is not safe without exposing TransactionScreen state, so use the compact layout only here.
              new = new.replace('onClick = { if (initialAccount != null) transactionViewModel /* keep state local to TransactionScreen */ }', 'onClick = { }')
              s = replace_once(s, old, new, 'PersonAccountScreen.kt')
              return s
          edit('app/src/main/java/com/myaccounts/app/ui/screens/PersonAccountScreen.kt', person_account)

          # 6) Remove the wide embedded add button; parent now owns the visual action surface.
          def transaction(s):
              old = '            if (embedded) androidx.compose.material3.Button(onClick = { showAddTransaction = true }, modifier = Modifier.fillMaxWidth(), shape = MaterialTheme.shapes.small) { Icon(Icons.Default.Add, contentDescription = null); Spacer(Modifier.width(8.dp)); Text("إضافة عملية", style = MaterialTheme.typography.labelLarge) }\n'
              return replace_once(s, old, '', 'TransactionScreen.kt')
          edit('app/src/main/java/com/myaccounts/app/ui/screens/TransactionScreen.kt', transaction)

          # 7) Custody reports: use the same FilterChip pattern as the main reports screen, avoiding weighted Arabic text clipping.
          def custody_reports(s):
              s = replace_once(s, 'import androidx.compose.material3.ExperimentalMaterial3Api\n', 'import androidx.compose.material3.ExperimentalMaterial3Api\nimport androidx.compose.material3.FilterChip\n', 'CustodyReportsScreen.kt')
              s = replace_once(s, '                        reportModeButton("أصحاب العُهَد", reportMode == 0, Modifier.weight(1f)) { reportMode = 0; personId = null }\n                        reportModeButton("الأرصدة", reportMode == 1, Modifier.weight(1f)) { reportMode = 1 }\n                        reportModeButton("العمليات", reportMode == 2, Modifier.weight(1f)) { reportMode = 2 }',
                  '                        FilterChip(reportMode == 0, { reportMode = 0; personId = null }, label = { Text("أصحاب العُهَد") })\n                        FilterChip(reportMode == 1, { reportMode = 1 }, label = { Text("الأرصدة") })\n                        FilterChip(reportMode == 2, { reportMode = 2 }, label = { Text("العمليات") })',
                  'CustodyReportsScreen.kt')
              old = '            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { reportCurrencies.forEach { code -> SecondaryButton(code, { currency = code }, Modifier.weight(1f), enabled = !busy) } }'
              new = '            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { reportCurrencies.forEach { code -> FilterChip(currency == code, { currency = code }, label = { Text(if (code == "ALL") "الكل" else code) }, enabled = !busy) } }'
              s = replace_once(s, old, new, 'CustodyReportsScreen.kt')
              old = '            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { SecondaryButton("كل الحساب", { onPeriod(0) }, Modifier.weight(1f), enabled = !busy); SecondaryButton("اليوم", { onPeriod(1) }, Modifier.weight(1f), enabled = !busy); SecondaryButton("الأسبوع", { onPeriod(2) }, Modifier.weight(1f), enabled = !busy); SecondaryButton("الشهر", { onPeriod(3) }, Modifier.weight(1f), enabled = !busy) }'
              new = '            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { FilterChip(period == 0, { onPeriod(0) }, label = { Text("كل الحساب") }, enabled = !busy); FilterChip(period == 1, { onPeriod(1) }, label = { Text("اليوم") }, enabled = !busy); FilterChip(period == 2, { onPeriod(2) }, label = { Text("الأسبوع") }, enabled = !busy); FilterChip(period == 3, { onPeriod(3) }, label = { Text("الشهر") }, enabled = !busy) }'
              s = replace_once(s, old, new, 'CustodyReportsScreen.kt')
              old = '            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { reportTypes.take(3).forEach { (code, label) -> SecondaryButton(if (code == "ALL") "الكل" else label, { onType(code) }, Modifier.weight(1f), enabled = !busy) } }\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { reportTypes.drop(3).forEach { (code, label) -> SecondaryButton(label, { onType(code) }, Modifier.weight(1f), enabled = !busy) } }'
              new = '            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { reportTypes.take(3).forEach { (code, label) -> FilterChip(currentType == code, { onType(code) }, label = { Text(if (code == "ALL") "الكل" else label) }, enabled = !busy) } }\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { reportTypes.drop(3).forEach { (code, label) -> FilterChip(currentType == code, { onType(code) }, label = { Text(label) }, enabled = !busy) } }'
              s = replace_once(s, old, new, 'CustodyReportsScreen.kt')
              old = '            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { SecondaryButton("الكل", { onPerson(null) }, Modifier.weight(1f), enabled = !busy); people.take(3).forEach { person -> SecondaryButton(person.name, { onPerson(person.id) }, Modifier.weight(1f), enabled = !busy) } }'
              new = '            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { FilterChip(currentPersonId == null, { onPerson(null) }, label = { Text("الكل") }, enabled = !busy); people.take(3).forEach { person -> FilterChip(currentPersonId == person.id, { onPerson(person.id) }, label = { Text(person.name) }, enabled = !busy) } }'
              s = replace_once(s, old, new, 'CustodyReportsScreen.kt')
              return s
          edit('app/src/main/java/com/myaccounts/app/ui/screens/CustodyReportsScreen.kt', custody_reports)

          print('ALL UI REPAIRS APPLIED')
      - name: Build verification
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/myaccounts/app/ui/screens
          git commit -m "fix(ui): align custody, backup, account and report screens" || exit 0
          git push
