name: Apply Pending UI Repairs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(ui):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Complete custody report filter scrolling
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyReportsScreen.kt')
          s = p.read_text(encoding='utf-8')
          old = s
          rows = [
            'Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { reportCurrencies.forEach',
            'Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { reportTypes.take(3).forEach',
            'Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { reportTypes.drop(3).forEach',
            'Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { FilterChip(currentPersonId == null',
          ]
          for prefix in rows:
            s = s.replace(prefix, prefix.replace('Row(Modifier.fillMaxWidth()', 'Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState())'), 1)
          if 'horizontalScroll(rememberScrollState())' not in s:
            raise SystemExit('No custody report filter was patched')
          if s != old:
            p.write_text(s, encoding='utf-8')

          p = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyCompactScreenFinal.kt')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\n', 'import androidx.compose.ui.unit.dp\n')
          s = s.replace('import androidx.compose.foundation.clickable\n', 'import androidx.compose.foundation.clickable\nimport androidx.compose.foundation.isSystemInDarkTheme\n')
          s = s.replace('import com.myaccounts.app.ui.theme.Due\n', 'import com.myaccounts.app.ui.theme.Due\nimport com.myaccounts.app.ui.theme.EntityName\nimport com.myaccounts.app.ui.theme.EntityNameDark\n')
          old_metric = 'Text(value, fontSize = 12.sp, fontWeight = FontWeight.Bold, color = finalStatusColor(status), maxLines = 1); Spacer(Modifier.width(3.dp)); Text(status, fontSize = 9.sp, fontWeight = FontWeight.Medium, color = finalStatusColor(status), maxLines = 1)'
          new_metric = 'Text(value, style = MaterialTheme.typography.labelMedium, fontWeight = FontWeight.Bold, color = finalStatusColor(status), maxLines = 1); Spacer(Modifier.width(3.dp)); Text(status, style = MaterialTheme.typography.labelSmall, fontWeight = FontWeight.Medium, color = finalStatusColor(status), maxLines = 1)'
          if old_metric not in s:
            raise SystemExit('Custody metric typography target not found')
          s = s.replace(old_metric, new_metric, 1)
          s = s.replace('Text(custody.name, fontWeight = FontWeight.Bold, style = MaterialTheme.typography.titleMedium);', 'Text(custody.name, fontWeight = FontWeight.Bold, style = MaterialTheme.typography.titleMedium, color = if (isSystemInDarkTheme()) EntityNameDark else EntityName);', 1)
          s = s.replace('Text(person.name, fontWeight = FontWeight.Bold, style = MaterialTheme.typography.titleMedium);', 'Text(person.name, fontWeight = FontWeight.Bold, style = MaterialTheme.typography.titleMedium, color = if (isSystemInDarkTheme()) EntityNameDark else EntityName);', 1)
          p.write_text(s, encoding='utf-8')
      - name: Build verification
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Commit repairs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/src/main/java/com/myaccounts/app/ui/screens/CustodyReportsScreen.kt app/src/main/java/com/myaccounts/app/ui/screens/CustodyCompactScreenFinal.kt
          if git diff --cached --quiet; then
            echo 'No UI source changes required.'
          else
            git commit -m 'fix(ui): normalize custody entity typography and colors'
            git push
          fi
