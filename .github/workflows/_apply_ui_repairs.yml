name: Apply Pending UI Repairs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(ui):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Complete custody report filter scrolling
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyReportsScreen.kt')
          s = p.read_text(encoding='utf-8')
          old = s
          rows = [
            'Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { reportCurrencies.forEach',
            'Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { reportTypes.take(3).forEach',
            'Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { reportTypes.drop(3).forEach',
            'Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { FilterChip(currentPersonId == null',
          ]
          for prefix in rows:
            s = s.replace(prefix, prefix.replace('Row(Modifier.fillMaxWidth()', 'Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState())'), 1)
          if 'horizontalScroll(rememberScrollState())' not in s:
            raise SystemExit('No custody report filter was patched')
          if s != old:
            p.write_text(s, encoding='utf-8')
          else:
            print('All targeted report filter rows were already patched.')
      - name: Build verification
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Commit repairs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/src/main/java/com/myaccounts/app/ui/screens/CustodyReportsScreen.kt
          if git diff --cached --quiet; then
            echo 'No report filter source changes required.'
          else
            git commit -m 'fix(ui): make all custody report filters horizontally scrollable'
            git push
          fi
