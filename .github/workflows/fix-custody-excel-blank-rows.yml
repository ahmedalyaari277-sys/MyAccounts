name: Fix custody Excel blank rows

on:
  push:
    branches: [fix/custody-excel-category-import]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch blank-row handling
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/myaccounts/app/util/CustodyExcelDataManager.kt')
          s = p.read_text(encoding='utf-8')
          old = '''                            } else if (rowNumber > 1) {

                                result += row(
                                    rowNumber,
                                    (0..20).map {
                                        cells[it].orEmpty()
                                    }
                                )
'''
          new = '''                            } else if (rowNumber > 1) {

                                val values = (0..20).map {
                                    cells[it].orEmpty()
                                }

                                if (values.any { it.isNotBlank() }) {
                                    result += row(rowNumber, values)
                                }
'''
          if old not in s:
              raise SystemExit('expected row parsing block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/myaccounts/app/util/CustodyExcelDataManager.kt
          git diff --cached --check
          git commit -m 'fix(excel): ignore blank custody worksheet rows'
          git push
