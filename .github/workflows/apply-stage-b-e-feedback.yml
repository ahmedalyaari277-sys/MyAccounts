name: Apply verified custody B-E feedback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-stage-b-e-feedback.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply B-E fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # B: match Accounts wording exactly.
          home = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyHomeWithArchiveScreen.kt')
          s = home.read_text()
          s = s.replace('Text("إدارة بيانات العُهَد")', 'Text("النسخ الاحتياطي و الاستعادة")')

          # C: make the custody creation dialog truly IME-aware and move the focused field into view.
          imports = 'import androidx.compose.foundation.relocation.BringIntoViewRequester\nimport androidx.compose.foundation.relocation.bringIntoViewRequester\nimport androidx.compose.ui.focus.onFocusEvent\nimport kotlinx.coroutines.launch\n'
          if 'BringIntoViewRequester' not in s:
              s = s.replace('import androidx.compose.foundation.verticalScroll\n', 'import androidx.compose.foundation.verticalScroll\n' + imports)
          helper = '''\n@Composable\nprivate fun Modifier.custodyKeepFocusedFieldVisible(): Modifier {\n    val requester = remember { BringIntoViewRequester() }\n    val scope = rememberCoroutineScope()\n    return bringIntoViewRequester(requester).onFocusEvent {\n        if (it.isFocused) scope.launch { requester.bringIntoView() }\n    }\n}\n'''
          if 'fun Modifier.custodyKeepFocusedFieldVisible' not in s:
              s = s.replace('private val custodyHomeCurrencies = listOf("YER", "SAR", "USD")\n', 'private val custodyHomeCurrencies = listOf("YER", "SAR", "USD")\n' + helper)
          s = s.replace('properties = DialogProperties(usePlatformDefaultWidth = false)', 'properties = DialogProperties(usePlatformDefaultWidth = false, decorFitsSystemWindows = false)', 1)
          s = s.replace('modifier = Modifier.fillMaxWidth(0.94f).fillMaxHeight(0.90f),', 'modifier = Modifier.fillMaxWidth(0.94f).fillMaxHeight(0.90f).imePadding().navigationBarsPadding(),', 1)
          s = s.replace('.weight(1f, fill = false)\n                        .verticalScroll', '.weight(1f)\n                        .verticalScroll', 1)
          fields = [
              'OutlinedTextField(name, { name = it }, Modifier.fillMaxWidth(),',
              'OutlinedTextField(phone, { phone = it }, Modifier.fillMaxWidth(),',
              'OutlinedTextField(address, { address = it }, Modifier.fillMaxWidth(),',
              'OutlinedTextField(notes, { notes = it }, Modifier.fillMaxWidth(),',
              'OutlinedTextField(organization, { organization = it }, Modifier.fillMaxWidth(),',
              'OutlinedTextField(organizationPhone, { organizationPhone = it }, Modifier.fillMaxWidth(),',
              'OutlinedTextField(organizationAddress, { organizationAddress = it }, Modifier.fillMaxWidth(),',
              'OutlinedTextField(organizationNotes, { organizationNotes = it }, Modifier.fillMaxWidth(),',
          ]
          for old in fields:
              s = s.replace(old, old.replace('Modifier.fillMaxWidth()', 'Modifier.fillMaxWidth().custodyKeepFocusedFieldVisible()'), 1)
          home.write_text(s)

          compact = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyCompactScreenFinal.kt')
          s = compact.read_text()

          # D/E: entity party stays first regardless of the selected sort; toolbar uses fixed slots.
          old = '''val shown = people.let { rows -> if (latestFirst) rows.sortedByDescending { latestByPerson[it.id] ?: 0L } else rows.sortedBy { it.name.trim().lowercase(Locale.getDefault()) } }.filter { search.isBlank() || it.name.contains(search.trim(), true) || it.phone.contains(search.trim(), true) }'''
          new = '''val shown = people.filter { search.isBlank() || it.name.contains(search.trim(), true) || it.phone.contains(search.trim(), true) }.let { rows ->\n        val entity = rows.filter { it.partyType == "ENTITY" }\n        val others = rows.filter { it.partyType != "ENTITY" }.let { rest ->\n            if (latestFirst) rest.sortedByDescending { latestByPerson[it.id] ?: 0L }\n            else rest.sortedBy { it.name.trim().lowercase(Locale.getDefault()) }\n        }\n        entity + others\n    }'''
          if old not in s: raise SystemExit('E sort block not found')
          s = s.replace(old, new, 1)

          old_toolbar = '''Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {\n                    Text("الأطراف", fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)\n                    Row(Modifier.width(140.dp), horizontalArrangement = Arrangement.Start, verticalAlignment = Alignment.CenterVertically) {\n                        IconButton(onClick = { sortMenu = true }, modifier = Modifier.semantics { contentDescription = "ترتيب الأطراف" }) { Icon(Icons.Default.Sort, null) }\n                        TextButton(enabled = !current.isClosed, onClick = { addPerson = true }, modifier = Modifier.semantics { contentDescription = "إضافة طرف" }) { Icon(Icons.Default.Add, null); Spacer(Modifier.width(2.dp)); Text("إضافة") }\n                    }\n                    DropdownMenu(expanded = sortMenu, onDismissRequest = { sortMenu = false }) { DropdownMenuItem(text = { Text("أحدث عملية") }, onClick = { latestFirst = true; sortMenu = false }); DropdownMenuItem(text = { Text("أبجديًا") }, onClick = { latestFirst = false; sortMenu = false }) }\n                }'''
          new_toolbar = '''Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n                    Text("الأطراف", modifier = Modifier.weight(1f), fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)\n                    Box(Modifier.width(148.dp).height(48.dp), contentAlignment = Alignment.CenterEnd) {\n                        Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.Start, verticalAlignment = Alignment.CenterVertically) {\n                            IconButton(onClick = { sortMenu = true }, modifier = Modifier.size(48.dp).semantics { contentDescription = "ترتيب الأطراف" }) { Icon(Icons.Default.Sort, null) }\n                            TextButton(enabled = !current.isClosed, onClick = { addPerson = true }, modifier = Modifier.height(48.dp).semantics { contentDescription = "إضافة طرف" }) { Icon(Icons.Default.Add, null); Spacer(Modifier.width(2.dp)); Text("إضافة") }\n                        }\n                    }\n                    DropdownMenu(expanded = sortMenu, onDismissRequest = { sortMenu = false }) { DropdownMenuItem(text = { Text("أحدث عملية") }, onClick = { latestFirst = true; sortMenu = false }); DropdownMenuItem(text = { Text("أبجديًا") }, onClick = { latestFirst = false; sortMenu = false }) }\n                }'''
          if old_toolbar not in s: raise SystemExit('E toolbar block not found')
          s = s.replace(old_toolbar, new_toolbar, 1)

          old_entity_quick = '''if (person.partyType == "ENTITY") onPerson(person.id)\n          else { quickOwner = false; quickPerson = person.id }'''
          new_entity_quick = '''quickOwner = false\n          quickPerson = person.id'''
          if old_entity_quick not in s: raise SystemExit('D entity quick block not found')
          s = s.replace(old_entity_quick, new_entity_quick, 1)
          compact.write_text(s)

          ledger = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyLedgerScreen.kt')
          s = ledger.read_text()
          # D: the automatically created organization party has only one operation: صرف.
          if 'val custodyPeople by vm.persons(custodyId).collectAsState()' not in s:
              needle = 'val context = LocalContext.current; val allTransactions by vm.transactions(custodyId).collectAsState(); val keyboard = LocalSoftwareKeyboardController.current; val calc = LocalCalculatorController.current; val scope = rememberCoroutineScope()'
              if needle not in s: raise SystemExit('Ledger dialog insertion point not found')
              s = s.replace(needle, needle + '; val custodyPeople by vm.persons(custodyId).collectAsState()', 1)
          old_types = 'val availableTypes = if (owner) listOf(CustodyTransactionType.RECEIVED_FROM_ORG, CustodyTransactionType.RETURNED_TO_ORG, CustodyTransactionType.ORG_LOAN_FROM_OWNER, CustodyTransactionType.ORG_LOAN_REPAYMENT) else listOf(CustodyTransactionType.PAID_TO_PERSON, CustodyTransactionType.RETURNED_FROM_PERSON, CustodyTransactionType.PERSON_LOAN_TO_OWNER, CustodyTransactionType.OWNER_REPAY_PERSON_LOAN)'
          new_types = 'val entityParty = !owner && custodyPeople.firstOrNull { it.id == personId }?.partyType == "ENTITY"\n    val availableTypes = when { owner -> listOf(CustodyTransactionType.RECEIVED_FROM_ORG, CustodyTransactionType.RETURNED_TO_ORG, CustodyTransactionType.ORG_LOAN_FROM_OWNER, CustodyTransactionType.ORG_LOAN_REPAYMENT); entityParty -> listOf(CustodyTransactionType.PAID_TO_PERSON); else -> listOf(CustodyTransactionType.PAID_TO_PERSON, CustodyTransactionType.RETURNED_FROM_PERSON, CustodyTransactionType.PERSON_LOAN_TO_OWNER, CustodyTransactionType.OWNER_REPAY_PERSON_LOAN) }'
          if old_types not in s: raise SystemExit('availableTypes block not found')
          s = s.replace(old_types, new_types, 1)
          ledger.write_text(s)
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myaccounts/app/ui/screens/CustodyHomeWithArchiveScreen.kt app/src/main/java/com/myaccounts/app/ui/screens/CustodyCompactScreenFinal.kt app/src/main/java/com/myaccounts/app/ui/screens/CustodyLedgerScreen.kt
          git commit -m 'fix(custody): complete verified B-E feedback'
          git push