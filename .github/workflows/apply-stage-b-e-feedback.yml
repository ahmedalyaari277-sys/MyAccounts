name: Apply verified custody B-E feedback
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply current B-E fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # B — use the same label as Accounts.
          p=Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyTransferScreen.kt')
          s=p.read_text().replace('نقل بيانات العُهَد','النسخ الاحتياطي و الاستعادة')
          p.write_text(s)

          # C — keep the creation form above the IME and reduce the dialog viewport when the IME is active.
          p=Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyHomeWithArchiveScreen.kt')
          s=p.read_text()
          s=s.replace('.fillMaxHeight(0.90f).imePadding().navigationBarsPadding()', '.fillMaxHeight(0.78f).imePadding().navigationBarsPadding()')
          p.write_text(s)

          # D/E — organization is always first; normal parties alone are searched/sorted; toolbar slots are fixed.
          p=Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyCompactScreenFinal.kt')
          s=p.read_text()
          old='''    val shown = people.filter { search.isBlank() || it.name.contains(search.trim(), true) || it.phone.contains(search.trim(), true) }.let { rows ->
        val entity = rows.filter { it.partyType == "ENTITY" }
        val others = rows.filter { it.partyType != "ENTITY" }.let { rest ->
            if (latestFirst) rest.sortedByDescending { latestByPerson[it.id] ?: 0L }
            else rest.sortedBy { it.name.trim().lowercase(Locale.getDefault()) }
        }
        entity + others
    }'''
          new='''    val fixedEntity = people.firstOrNull { it.partyType == "ENTITY" }
    val filteredOthers = people.filter { it.partyType != "ENTITY" && (search.isBlank() || it.name.contains(search.trim(), true) || it.phone.contains(search.trim(), true)) }
    val sortedOthers = if (latestFirst) filteredOthers.sortedByDescending { latestByPerson[it.id] ?: 0L } else filteredOthers.sortedBy { it.name.trim().lowercase(Locale.getDefault()) }
    val shown = listOfNotNull(fixedEntity) + sortedOthers'''
          if old not in s: raise SystemExit('party-list block not found')
          s=s.replace(old,new,1)
          s=s.replace('.width(148.dp).height(48.dp)', '.width(164.dp).height(48.dp)')
          s=s.replace('modifier = Modifier.height(48.dp).semantics { contentDescription = "إضافة طرف" }','modifier = Modifier.width(108.dp).height(48.dp).semantics { contentDescription = "إضافة طرف" }')
          p.write_text(s)

          # D — organization party gets only صرف.
          p=Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyLedgerScreen.kt')
          s=p.read_text()
          old='val availableTypes = if (entityParty) listOf(CustodyTransactionType.PAID_TO_PERSON) else if (owner) listOf(CustodyTransactionType.RECEIVED_FROM_ORG, CustodyTransactionType.RETURNED_TO_ORG, CustodyTransactionType.ORG_LOAN_FROM_OWNER, CustodyTransactionType.ORG_LOAN_REPAYMENT) else listOf(CustodyTransactionType.PAID_TO_PERSON, CustodyTransactionType.RETURNED_FROM_PERSON, CustodyTransactionType.PERSON_LOAN_TO_OWNER, CustodyTransactionType.OWNER_REPAY_PERSON_LOAN)'
          new='val availableTypes = if (entityParty) listOf(CustodyTransactionType.PAID_TO_PERSON) else if (owner) listOf(CustodyTransactionType.RECEIVED_FROM_ORG, CustodyTransactionType.RETURNED_TO_ORG, CustodyTransactionType.ORG_LOAN_FROM_OWNER, CustodyTransactionType.ORG_LOAN_REPAYMENT) else listOf(CustodyTransactionType.PAID_TO_PERSON, CustodyTransactionType.RETURNED_FROM_PERSON, CustodyTransactionType.PERSON_LOAN_TO_OWNER, CustodyTransactionType.OWNER_REPAY_PERSON_LOAN)'
          if old not in s: raise SystemExit('operation-type block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/myaccounts/app/ui/screens/CustodyTransferScreen.kt app/src/main/java/com/myaccounts/app/ui/screens/CustodyHomeWithArchiveScreen.kt app/src/main/java/com/myaccounts/app/ui/screens/CustodyCompactScreenFinal.kt app/src/main/java/com/myaccounts/app/ui/screens/CustodyLedgerScreen.kt
          git commit -m 'fix(custody): final B-E keyboard and party UX'
          git push