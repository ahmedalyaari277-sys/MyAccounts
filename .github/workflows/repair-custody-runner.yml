name: Repair custody UI regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-custody-runner.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply verified custody UI fixes
        shell: python
        run: |
          from pathlib import Path

          ops = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyOperationsScreen.kt')
          s = ops.read_text()

          old = '''        onSave = { person ->
            scope.launch {
                personSaving = true
                runCatching { vm.addPersonAndWait(custodyId, person) }.onSuccess { addPerson = false }
                personSaving = false
            }
        }'''
          new = '''        onSave = { person ->
            personSaving = true
            runCatching { vm.addPersonAndWait(custodyId, person) }.onSuccess { addPerson = false }
            personSaving = false
        }'''
          if old not in s:
              raise SystemExit('person save block not found')
          s = s.replace(old, new, 1)
          s = s.replace('    val scope = rememberCoroutineScope()\n    val matches = existing.filter', '    val matches = existing.filter', 1)

          old = 'properties = DialogProperties(usePlatformDefaultWidth = false, decorFitsSystemWindows = false)'
          if old not in s:
              raise SystemExit('custody operation dialog properties not found')
          s = s.replace(old, 'properties = DialogProperties(usePlatformDefaultWidth = false)', 1)
          ops.write_text(s)

          person_ops = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyPersonOperationsScreen.kt')
          s = person_ops.read_text()
          old = 'properties = DialogProperties(usePlatformDefaultWidth = false, decorFitsSystemWindows = false)'
          if old not in s:
              raise SystemExit('person operation dialog properties not found')
          s = s.replace(old, 'properties = DialogProperties(usePlatformDefaultWidth = false)', 1)
          person_ops.write_text(s)

      - name: Verify source build and unit tests
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Commit repaired source and remove repair workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-custody-runner.yml .github/workflows/fix-custody-ui-regression.yml
          git add app/src/main/java/com/myaccounts/app/ui/screens/CustodyOperationsScreen.kt app/src/main/java/com/myaccounts/app/ui/screens/CustodyPersonOperationsScreen.kt .github/workflows/repair-custody-runner.yml .github/workflows/fix-custody-ui-regression.yml
          git commit -m "fix(custody): stabilize person save and operation dialogs"
          git push origin HEAD:main
