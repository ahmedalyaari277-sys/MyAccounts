name: One-off currency account rule patcher

on:
  push:
    branches: [fix/reports-import-attachment-ui]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch restore and M-03 test
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          backup = Path("app/src/main/java/com/myaccounts/app/util/DatabaseBackupManager.kt")
          text = backup.read_text(encoding="utf-8")
          old = '''        val transactions = backup.getJSONArray("transactions")\n        for (i in 0 until transactions.length()) {'''
          new = '''        val supportedCurrencies = listOf("YER", "SAR", "USD")\n        db.query("SELECT id FROM people").use { peopleCursor ->\n            while (peopleCursor.moveToNext()) {\n                val personId = peopleCursor.getLong(0)\n                for (currencyCode in supportedCurrencies) {\n                    db.execSQL(\n                        "INSERT OR IGNORE INTO currency_accounts (personId,currencyCode,balanceMinor,createdAt,updatedAt) VALUES (?,?,?,?,?)",\n                        arrayOf(personId, currencyCode, 0L, System.currentTimeMillis(), System.currentTimeMillis())\n                    )\n                }\n            }\n        }\n\n        val transactions = backup.getJSONArray("transactions")\n        for (i in 0 until transactions.length()) {'''
          if "val supportedCurrencies = listOf(\"YER\", \"SAR\", \"USD\")" not in text:
              if old not in text:
                  raise SystemExit("Restore insertion anchor not found")
              text = text.replace(old, new, 1)
              backup.write_text(text, encoding="utf-8")

          test = Path("app/src/androidTest/java/com/myaccounts/app/backup/BackupRestoreInstrumentedTest.kt")
          t = test.read_text(encoding="utf-8")
          needle = '''        // Legacy backups can contain fewer currency accounts; current app must normalize the restored person.\n        assertEquals(3, countCurrencyAccountsForPerson(\"LEGACY_PERSON\"))\n'''
          if "LEGACY_PERSON" not in t and "countCurrencyAccountsForPerson" not in t:
              anchor = '    private fun countTransactionsForPerson(externalId: String): Int {'
              helper = '''    private fun countCurrencyAccountsForPerson(externalId: String): Int = database.openHelper.writableDatabase.query("SELECT COUNT(*) FROM currency_accounts WHERE personId=(SELECT id FROM people WHERE externalId=?)", arrayOf(externalId)).use { c -> c.moveToFirst(); c.getInt(0) }\n\n'''
              if anchor in t:
                  t = t.replace(anchor, helper + anchor, 1)
                  test.write_text(t, encoding="utf-8")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "app/src/main/java/com/myaccounts/app/util/DatabaseBackupManager.kt", "app/src/androidTest/java/com/myaccounts/app/backup/BackupRestoreInstrumentedTest.kt", ".github/workflows/one-off-currency-rule.yml"], check=True)
          subprocess.run(["git", "commit", "-m", "fix(accounts): normalize all currency accounts after restore"], check=True)
          subprocess.run(["git", "push"], check=True)
