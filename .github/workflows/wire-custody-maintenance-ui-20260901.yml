name: Wire custody maintenance UI
on:
  push:
    branches: [repair/custody-final-settlement-20260901]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/custody-final-settlement-20260901
          fetch-depth: 0
      - name: Apply screen wiring
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          ops = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyOperationsScreen.kt')
          s = ops.read_text()
          if 'var showEditCustody by remember' not in s:
              s = s.replace('    var showPersonSortMenu by remember { mutableStateOf(false) }\n', '    var showPersonSortMenu by remember { mutableStateOf(false) }\n    var showEditCustody by remember { mutableStateOf(false) }\n')
          if 'DropdownMenuItem(text = { Text("تعديل بيانات العهدة") }' not in s:
              s = s.replace('                        DropdownMenuItem(text = { Text("تقرير العهدة") }, onClick = { menu = false; showReport = true })\n', '                        DropdownMenuItem(text = { Text("تقرير العهدة") }, onClick = { menu = false; showReport = true })\n                        if (!current.isClosed) DropdownMenuItem(text = { Text("تعديل بيانات العهدة") }, onClick = { menu = false; showEditCustody = true })\n', 1)
          if 'if (showEditCustody) CustodyDataEditDialog' not in s:
              marker = '    if (showSettlement) CustodySettlementDialog(vm, current, transactions, people, { showSettlement = false })\n'
              if marker not in s: raise SystemExit('operations settlement anchor missing')
              s = s.replace(marker, marker + '    if (showEditCustody) CustodyDataEditDialog(vm, current, onDismiss = { showEditCustody = false }, onSaved = { showEditCustody = false })\n', 1)
          ops.write_text(s)

          led = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyLedgerScreen.kt')
          s = led.read_text()
          if 'var showOwnerMenu by remember' not in s:
              s = s.replace('    var deleting by remember { mutableStateOf<CustodyTransactionEntity?>(null) }\n', '    var deleting by remember { mutableStateOf<CustodyTransactionEntity?>(null) }\n    var showOwnerMenu by remember { mutableStateOf(false) }\n    var showEditOwner by remember { mutableStateOf(false) }\n    var showEditCustody by remember { mutableStateOf(false) }\n', 1)
          if 'showOwnerMenu = true' not in s:
              pattern = re.escape('    Scaffold(\n        topBar = { TopAppBar(title = { Text("عمليات $title", fontWeight = FontWeight.Bold) }, navigationIcon = { IconButton(onClick = onBack) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "رجوع") } }) },')
              replacement = '''    Scaffold(
        topBar = { TopAppBar(title = { Text("عمليات $title", fontWeight = FontWeight.Bold) }, navigationIcon = { IconButton(onClick = onBack) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "رجوع") } }, actions = {
            if (owner) {
                IconButton(onClick = { showOwnerMenu = true }) { Icon(Icons.Default.MoreVert, "المزيد") }
                DropdownMenu(expanded = showOwnerMenu, onDismissRequest = { showOwnerMenu = false }) {
                    if (!current.isClosed) {
                        DropdownMenuItem(text = { Text("تعديل بيانات حامل العهدة") }, onClick = { showOwnerMenu = false; showEditOwner = true })
                        DropdownMenuItem(text = { Text("تعديل بيانات العهدة") }, onClick = { showOwnerMenu = false; showEditCustody = true })
                    }
                }
            }
        } ) },'''
              s2,n = re.sub(pattern, replacement, s, count=1)
              if n != 1: raise SystemExit('ledger topbar anchor missing')
              s = s2
          if 'if (showEditOwner) CustodyOwnerEditDialog' not in s:
              marker = '    deleting?.let { t -> AlertDialog(onDismissRequest = { deleting = null }, title = { Text("حذف العملية") }, text = { Text("سيتم حذف العملية نهائيًا.") }, confirmButton = { TextButton(onClick = { vm.deleteTransaction(t.id); deleting = null }) { Text("حذف", color = MaterialTheme.colorScheme.error) } }, dismissButton = { TextButton(onClick = { deleting = null }) { Text("إلغاء") } }) }\n'
              if marker not in s: raise SystemExit('ledger delete anchor missing')
              add = marker + '    if (showEditOwner) CustodyOwnerEditDialog(vm, current, onDismiss = { showEditOwner = false }, onSaved = { showEditOwner = false })\n    if (showEditCustody) CustodyDataEditDialog(vm, current, onDismiss = { showEditCustody = false }, onSaved = { showEditCustody = false })\n'
              s = s.replace(marker, add, 1)
          led.write_text(s)

          # Remove this temporary workflow before committing the source changes.
          wf = Path('.github/workflows/wire-custody-maintenance-ui-20260901.yml')
          if wf.exists(): wf.unlink()

          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','.'], check=True)
          subprocess.run(['git','commit','-m','feat(custody): wire maintenance edit flows'], check=True)
          subprocess.run(['git','push','origin','repair/custody-final-settlement-20260901'], check=True)
