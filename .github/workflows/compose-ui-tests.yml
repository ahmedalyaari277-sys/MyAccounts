name: Compose UI Tests

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA to test"
        required: true
        type: string
  push:
    branches: [feat/custody-module]
    paths:
      - 'app/src/main/java/com/myaccounts/app/ui/screens/Custody**'
      - 'app/src/main/java/com/myaccounts/app/data/custody/**'
      - 'app/src/main/java/com/myaccounts/app/ui/viewmodel/CustodyViewModel.kt'
      - 'app/src/androidTest/java/com/myaccounts/app/custody/**'
      - 'app/src/main/java/com/myaccounts/app/ui/navigation/**'
      - '.github/workflows/compose-ui-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/myaccounts/app/ui/screens/Custody**'
      - 'app/src/main/java/com/myaccounts/app/data/custody/**'
      - 'app/src/main/java/com/myaccounts/app/ui/viewmodel/CustodyViewModel.kt'
      - 'app/src/androidTest/java/com/myaccounts/app/custody/**'
      - 'app/src/main/java/com/myaccounts/app/ui/navigation/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/compose-ui-tests.yml'

jobs:
  compose-ui-tests:
    name: Compose UI Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run instrumented Compose UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          avd-name: test
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          disable-linux-hw-accel: false
          pre-emulator-launch-script: adb start-server
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custody-compose-ui-test-results
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
