name: Complete custody edit flows
on:
  push:
    branches: [repair/custody-final-settlement-20260901]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/custody-final-settlement-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply remaining custody UI flows
        shell: python
        run: |
          from pathlib import Path
          root = Path('.')

          vm = root/'app/src/main/java/com/myaccounts/app/ui/viewmodel/CustodyViewModel.kt'
          s = vm.read_text()
          if 'suspend fun updatePersonAndWait' not in s:
              s = s.replace('    suspend fun deletePersonAndWait(id: Long) = repo.deletePerson(id)\n', '    suspend fun deletePersonAndWait(id: Long) = repo.deletePerson(id)\n    suspend fun updatePersonAndWait(p: CustodyPersonEntity) = repo.updatePerson(p)\n')
          if 'suspend fun updateCustodyAndWait' not in s:
              s = s.replace('    fun updateCustody(c: CustodyEntity) = viewModelScope.launch { repo.updateCustody(c) }\n', '    fun updateCustody(c: CustodyEntity) = viewModelScope.launch { repo.updateCustody(c) }\n    suspend fun updateCustodyAndWait(c: CustodyEntity) = repo.updateCustody(c)\n')
          vm.write_text(s)

          dialogs = root/'app/src/main/java/com/myaccounts/app/ui/screens/CustodyEditDialogs.kt'
          if not dialogs.exists():
              dialogs.write_text(r'''package com.myaccounts.app.ui.screens

import androidx.compose.foundation.layout.*
import androidx.compose.foundation.rememberScrollState
import androidx.compose.foundation.verticalScroll
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Modifier
import androidx.compose.ui.unit.dp
import com.myaccounts.app.data.custody.CustodyEntity
import com.myaccounts.app.data.custody.CustodyPersonEntity
import com.myaccounts.app.ui.viewmodel.CustodyViewModel
import kotlinx.coroutines.launch

@Composable
fun CustodyPersonEditDialog(vm: CustodyViewModel, person: CustodyPersonEntity, onDismiss: () -> Unit, onSaved: () -> Unit) {
    var name by remember { mutableStateOf(person.name) }
    var phone by remember { mutableStateOf(person.phone) }
    var address by remember { mutableStateOf(person.address) }
    var notes by remember { mutableStateOf(person.notes) }
    var saving by remember { mutableStateOf(false) }
    var error by remember { mutableStateOf<String?>(null) }
    val scope = rememberCoroutineScope()
    AlertDialog(onDismissRequest = { if (!saving) onDismiss() }, title = { Text("تعديل بيانات الشخص") }, text = {
        Column(Modifier.fillMaxWidth().verticalScroll(rememberScrollState()).imePadding(), verticalArrangement = Arrangement.spacedBy(8.dp)) {
            OutlinedTextField(name, { name = it }, Modifier.fillMaxWidth(), label = { Text("الاسم") }, singleLine = true, enabled = !saving)
            OutlinedTextField(phone, { phone = it }, Modifier.fillMaxWidth(), label = { Text("الهاتف") }, singleLine = true, enabled = !saving)
            OutlinedTextField(address, { address = it }, Modifier.fillMaxWidth(), label = { Text("العنوان") }, singleLine = true, enabled = !saving)
            OutlinedTextField(notes, { notes = it }, Modifier.fillMaxWidth(), label = { Text("الملاحظات") }, minLines = 2, enabled = !saving)
            error?.let { Text(it, color = MaterialTheme.colorScheme.error) }
        }
    }, confirmButton = { Button(enabled = name.isNotBlank() && !saving, onClick = {
        saving = true
        scope.launch { runCatching { vm.updatePersonAndWait(person.copy(name = name.trim(), phone = phone.trim(), address = address.trim(), notes = notes.trim())) }.onSuccess { saving = false; onSaved() }.onFailure { saving = false; error = it.message ?: "تعذر حفظ التعديل" } }
    }) { Text(if (saving) "جارٍ الحفظ…" else "حفظ") } }, dismissButton = { TextButton(enabled = !saving, onClick = onDismiss) { Text("إلغاء") } })
}

