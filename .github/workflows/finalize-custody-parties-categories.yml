name: Finalize custody parties and categories

on:
  push:
    branches: [repair/custody-final-settlement-20260901]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/custody-final-settlement-20260901
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix generated UI safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/myaccounts/app/ui/screens/CustodyCompactScreenFinal.kt')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.items', 'import androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.LazyRow\nimport androidx.compose.foundation.lazy.items', 1)
          old = '''Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\n                            categories.forEach { category -> SuggestionChip(onClick = {}, label = { Text(category) }) }\n                        }'''
          new = '''LazyRow(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\n                            items(categories, key = { it }) { category -> SuggestionChip(onClick = {}, label = { Text(category) }) }\n                        }'''
          if old not in s:
              raise SystemExit('Expected category Row was not found')
          s = s.replace(old, new, 1)
          s = s.replace('"عليه للأشخاص"', '"عليه للأطراف"')
          p.write_text(s, encoding='utf-8')

          # Do not require categories to be artificial people: validation remains a person/party record,
          # while categoryName is an independent operation dimension.
          e = Path('app/src/main/java/com/myaccounts/app/data/custody/CustodyEntities.kt')
          es = e.read_text(encoding='utf-8')
          assert 'partyType: String = "PERSON"' in es
          assert 'categoryName: String = ""' in es

      - name: Verify and compile
        run: |
          git diff --check
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Commit final fixes and remove temporary implementation workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/implement-custody-parties-categories.yml .github/workflows/run-custody-parties-implementation.yml
          git add app/src/main/java/com/myaccounts/app/ui/screens/CustodyCompactScreenFinal.kt \
            .github/workflows/implement-custody-parties-categories.yml \
            .github/workflows/run-custody-parties-implementation.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(custody): finalize party and category UI'
          git push origin HEAD:repair/custody-final-settlement-20260901
